    { name: "QuickSight", d: "BI y dashboards interactivos.", link: "https://aws.amazon.com/quicksight/",
      long: "Herramienta de <strong>business intelligence</strong> administrada: conecta con Redshift, RDS, Athena, S3 o archivos, y arma <strong>dashboards interactivos</strong> que se comparten con el equipo. Es <strong>serverless</strong> y se paga por usuario o por sesión, sin servidores de BI que mantener. Su motor en memoria, <strong>SPICE</strong>, guarda una copia de los datos para que los tableros respondan rápido sin golpear la base de origen en cada clic.",
      use: ["Dashboards de negocio sobre datos que ya viven en Redshift o Athena.", "Compartir reportes con gente que no escribe SQL.", "Embeber gráficos dentro de una aplicación propia.", "Alternativa administrada a Tableau o Power BI dentro de AWS."],
      avoid: ["Necesitás visualizaciones muy personalizadas &rarr; una librería propia sobre tus datos.", "Ya usás Tableau, Looker o Power BI y funcionan bien.", "Análisis exploratorio profundo con código &rarr; notebooks de <strong>SageMaker</strong>.", "Un solo reporte puntual: el costo por usuario no se justifica."],
      concepts: [{t:"SPICE",d:"Motor en memoria que cachea los datos para acelerar los tableros."},{t:"Dataset",d:"La fuente de datos preparada sobre la que se construyen los análisis."},{t:"Análisis vs Dashboard",d:"El análisis es el espacio de trabajo; el dashboard es la vista publicada."},{t:"Embedded analytics",d:"Insertar tableros dentro de tu propia aplicación."}] },
  ]},
  { cat: "Machine Learning", accent: "#35C2E8", items: [
    { name: "SageMaker", d: "Plataforma end-to-end para construir, entrenar y desplegar modelos.", link: "https://aws.amazon.com/sagemaker/",
      long: "Plataforma completa de <strong>machine learning</strong>: cubre todo el ciclo, desde preparar los datos y experimentar en <strong>notebooks</strong>, hasta <strong>entrenar</strong> en instancias con GPU y <strong>desplegar</strong> el modelo como endpoint con escalado automático. Sirve tanto para quien entrena modelos propios desde cero como para quien ajusta uno preexistente. Es la opción de <strong>máximo control</strong> del catálogo de ML de AWS, y a cambio exige saber de machine learning.",
      use: ["Entrenar un modelo propio sobre datos de tu negocio.", "Desplegar un modelo como API con escalado y versionado gestionados.", "Notebooks administrados para el equipo de datos, sin montar infraestructura.", "Pipelines de ML reproducibles: preparación, entrenamiento, evaluación, despliegue."],
      avoid: ["Solo necesitás una capacidad ya resuelta (leer texto de una imagen, analizar sentimiento) &rarr; <strong>Rekognition</strong> o <strong>Comprehend</strong>.", "Querés usar un modelo de lenguaje grande por API &rarr; <strong>Bedrock</strong>.", "No tenés datos etiquetados ni experiencia en ML: el esfuerzo es alto.", "Las instancias con GPU son caras: dejar un endpoint encendido sin uso duele."],
      concepts: [{t:"Notebook instance",d:"Entorno Jupyter administrado para experimentar."},{t:"Training job",d:"Ejecución de entrenamiento sobre instancias que se apagan al terminar."},{t:"Endpoint",d:"Modelo desplegado que responde inferencias en tiempo real."},{t:"Inferencia serverless",d:"Endpoint que escala a cero cuando no recibe tráfico."},{t:"JumpStart",d:"Modelos preentrenados listos para ajustar."}] },
    { name: "Rekognition", d: "Análisis de imágenes y video con IA.", link: "https://aws.amazon.com/rekognition/",
      long: "Análisis de <strong>imágenes y video</strong> mediante una llamada a la API, sin entrenar nada. Detecta objetos, escenas, texto dentro de imágenes, rostros y sus atributos, y modera contenido inapropiado. Es un servicio de <strong>IA preentrenada</strong>: le mandás la imagen y devuelve etiquetas con su nivel de confianza. También procesa video, siguiendo personas y objetos a lo largo del tiempo.",
      use: ["Moderar automáticamente imágenes que suben los usuarios.", "Extraer texto de fotos de documentos o carteles.", "Buscar en un catálogo de imágenes por contenido.", "Comparar rostros para verificación de identidad."],
      avoid: ["Necesitás detectar algo muy específico de tu dominio &rarr; entrenar un modelo propio en <strong>SageMaker</strong>.", "Análisis de texto plano &rarr; <strong>Comprehend</strong>.", "Documentos con formularios y tablas &rarr; Textract, especializado en eso.", "Reconocimiento facial: revisá las implicancias legales y de privacidad antes de usarlo."],
      concepts: [{t:"Label detection",d:"Identifica objetos y escenas presentes en la imagen."},{t:"Confidence score",d:"Grado de certeza de cada detección; conviene fijar un umbral."},{t:"Content moderation",d:"Marca contenido explícito o inapropiado."},{t:"Face comparison",d:"Mide la similitud entre dos rostros."}] },
    { name: "Comprehend", d: "NLP para extraer insights de texto.", link: "https://aws.amazon.com/comprehend/",
      long: "<strong>Procesamiento de lenguaje natural</strong> por API: le pasás texto y devuelve el <strong>sentimiento</strong> (positivo, negativo, neutro), las <strong>entidades</strong> mencionadas (personas, lugares, fechas, organizaciones), las frases clave, el idioma detectado y una clasificación temática. Como Rekognition, viene preentrenado — no hay que traer datos ni entrenar. Su variante <strong>Comprehend Medical</strong> extrae información clínica de textos médicos.",
      use: ["Analizar el sentimiento de reseñas o tickets de soporte a escala.", "Extraer nombres, fechas y organizaciones de documentos.", "Clasificar y enrutar automáticamente correos entrantes.", "Detectar y redactar información personal (PII) dentro de textos."],
      avoid: ["Necesitás generar texto o mantener una conversación &rarr; <strong>Bedrock</strong>.", "Clasificación muy específica de tu dominio: conviene un clasificador propio.", "Traducir texto &rarr; Amazon Translate.", "Volúmenes enormes de texto: el costo por carácter se acumula rápido."],
      concepts: [{t:"Sentiment analysis",d:"Clasifica el texto como positivo, negativo, neutro o mixto."},{t:"Entity recognition",d:"Extrae personas, lugares, fechas y organizaciones."},{t:"Key phrases",d:"Identifica los conceptos centrales del texto."},{t:"PII detection",d:"Encuentra datos personales para redactarlos o protegerlos."}] },
    { name: "Bedrock", d: "Acceso vía API a modelos fundacionales, incluido Claude.", link: "https://aws.amazon.com/bedrock/",
      long: "Acceso por <strong>una sola API</strong> a <strong>modelos fundacionales</strong> de varios proveedores — Anthropic (Claude), Meta, Mistral, Cohere y los Amazon Nova — sin administrar infraestructura. Es <strong>serverless</strong>: se paga por token consumido. Su valor está en que el modelo corre <strong>dentro de tu cuenta de AWS</strong>, con IAM, VPC y CloudTrail aplicando como en cualquier otro servicio, y tus datos no se usan para entrenar. Soporta RAG mediante Knowledge Bases y agentes que invocan herramientas.",
      use: ["Sumar capacidades de IA generativa a una app sin salir del entorno AWS.", "Chatbots y asistentes sobre documentación propia usando RAG.", "Resumen, extracción o clasificación de texto a escala.", "Comparar modelos de distintos proveedores sin cambiar la integración."],
      avoid: ["La tarea la resuelve un servicio preentrenado más barato &rarr; <strong>Comprehend</strong> o <strong>Rekognition</strong>.", "Necesitás entrenar un modelo propio desde cero &rarr; <strong>SageMaker</strong>.", "Requerís control total de los pesos del modelo y su despliegue.", "El costo por token es alto en volúmenes grandes: conviene medir antes de escalar."],
      concepts: [{t:"Modelo fundacional",d:"Modelo grande preentrenado, utilizable sin entrenamiento adicional."},{t:"Token",d:"Unidad de facturación: fragmentos de texto de entrada y salida."},{t:"Knowledge Base",d:"RAG administrado sobre tus documentos."},{t:"Agents",d:"El modelo invoca APIs y herramientas para completar tareas."},{t:"Guardrails",d:"Filtros de contenido y temas vedados aplicados a las respuestas."}] },
    { name: "Textract", d: "Extrae texto y datos estructurados de documentos escaneados.", link: "https://aws.amazon.com/textract/",
      long: "Extrae <strong>texto, formularios y tablas</strong> de documentos escaneados y PDFs. Va más allá del OCR clásico: no solo lee las letras, sino que <strong>entiende la estructura</strong> — reconoce que un campo es una etiqueta y el texto de al lado su valor, y preserva filas y columnas de una tabla. Devuelve pares clave-valor listos para cargar en una base, sin escribir reglas de parseo. Cada dato viene con su <strong>nivel de confianza</strong>, lo que permite enviar a revisión humana solo lo dudoso.",
      use: ["Digitalizar facturas, recibos o formularios en papel.", "Cargar datos de documentos de identidad a un sistema automáticamente.", "Extraer tablas de reportes en PDF para analizarlas.", "Procesar solicitudes escritas a mano en trámites o seguros."],
      avoid: ["Detectar objetos o escenas en fotos &rarr; <strong>Rekognition</strong>.", "Analizar el significado o el sentimiento del texto &rarr; <strong>Comprehend</strong>.", "Documentos con formato muy particular de tu dominio: puede requerir ajuste.", "Se cobra por página: en volúmenes altos conviene medir el costo antes."],
      concepts: [{t:"OCR vs Textract",d:"El OCR devuelve texto suelto; Textract devuelve estructura y relaciones."},{t:"Formularios",d:"Detecta pares etiqueta-valor dentro del documento."},{t:"Tablas",d:"Preserva filas y columnas del original."},{t:"Confianza",d:"Puntaje por dato extraído, útil para decidir qué revisar a mano."}] },
  ]},
  { cat: "Integración", accent: "#C9E86C", items: [
    { name: "SQS", d: "Colas de mensajes para desacoplar componentes.", link: "https://aws.amazon.com/sqs/",
      long: "<strong>Cola de mensajes</strong> administrada que desacopla los componentes de un sistema: el productor deja un mensaje y sigue trabajando; el consumidor lo procesa cuando puede. Si el consumidor se cae, los mensajes <strong>esperan en la cola</strong> en vez de perderse. Cada mensaje lo procesa <strong>un solo consumidor</strong> y luego se elimina. Absorbe picos de carga: mil pedidos simultáneos entran a la cola y se procesan al ritmo que el sistema aguante.",
      use: ["Desacoplar el frontend del procesamiento pesado (envío de mails, generación de PDFs).", "Absorber picos de tráfico sin tirar abajo el backend.", "Reintentar automáticamente tareas que fallaron.", "Comunicar microservicios sin que uno dependa de que el otro esté vivo."],
      avoid: ["Necesitás que varios servicios reciban el mismo mensaje &rarr; <strong>SNS</strong> o <strong>EventBridge</strong>.", "Querés releer el histórico de eventos: en SQS el mensaje se borra al consumirse &rarr; <strong>Kinesis</strong>.", "Enrutar por el contenido del evento con reglas &rarr; <strong>EventBridge</strong>.", "Comunicación sincrónica donde necesitás la respuesta al instante."],
      concepts: [{t:"Standard vs FIFO",d:"Standard: máximo throughput, orden no garantizado. FIFO: orden exacto y sin duplicados, menor throughput."},{t:"Visibility timeout",d:"Tiempo en que el mensaje queda oculto mientras se procesa; si no se borra, reaparece."},{t:"Dead-letter queue",d:"Cola donde van los mensajes que fallaron N veces, para revisarlos aparte."},{t:"Long polling",d:"Espera a que llegue un mensaje en vez de consultar en vacío; abarata y reduce latencia."}] },
    { name: "SNS", d: "Notificaciones pub/sub hacia múltiples suscriptores.", link: "https://aws.amazon.com/sns/",
      long: "Mensajería <strong>publicación/suscripción</strong>: publicás un mensaje en un <strong>topic</strong> y llega a <strong>todos los suscriptores a la vez</strong>. Es la diferencia central con SQS, donde un mensaje va a un solo consumidor. Los suscriptores pueden ser colas SQS, funciones Lambda, endpoints HTTP, direcciones de correo o SMS. El patrón habitual es <strong>fan-out</strong>: un evento se publica una vez y varias colas lo reciben, cada una alimentando un proceso distinto.",
      use: ["Avisar a varios sistemas a la vez de que ocurrió algo (se creó un pedido).", "Enviar alertas por mail o SMS desde alarmas de CloudWatch.", "Fan-out: un topic publica hacia varias colas SQS con procesamientos distintos.", "Notificaciones push a aplicaciones móviles."],
      avoid: ["Un solo consumidor que procesa a su ritmo con reintentos &rarr; <strong>SQS</strong>.", "Enrutamiento por contenido o filtrado complejo &rarr; <strong>EventBridge</strong>.", "Necesitás persistencia: si un suscriptor está caído puede perder el mensaje, salvo que suscribas una cola SQS.", "Streaming continuo de alto volumen &rarr; <strong>Kinesis</strong>."],
      concepts: [{t:"Topic",d:"Canal donde se publican los mensajes."},{t:"Suscripción",d:"Destino que recibe cada publicación: SQS, Lambda, HTTP, email, SMS."},{t:"Fan-out",d:"Un mensaje llega a muchos destinos simultáneamente."},{t:"Filter policy",d:"Filtra por atributos para que un suscriptor reciba solo lo que le interesa."},{t:"vs SQS",d:"SNS empuja a muchos; SQS retiene para uno."}] },
    { name: "EventBridge", d: "Bus de eventos serverless para conectar servicios.", link: "https://aws.amazon.com/eventbridge/",
      long: "<strong>Bus de eventos serverless</strong>: los servicios publican eventos y unas <strong>reglas</strong> deciden a qué destino enviarlos según el <strong>contenido</strong> del evento — no solo el topic. Recibe eventos de los propios servicios de AWS, de aplicaciones propias y de proveedores SaaS externos. También funciona como <strong>programador</strong>: ejecuta una Lambda con expresiones cron, reemplazando al viejo CloudWatch Events. Es la pieza central de las arquitecturas dirigidas por eventos.",
      use: ["Reaccionar automáticamente a eventos de AWS (una instancia cambió de estado, se subió un objeto).", "Tareas programadas con cron sin servidor que las dispare.", "Enrutar eventos a distintos destinos según su contenido.", "Integrar eventos de servicios SaaS externos dentro de AWS."],
      avoid: ["Cola simple de trabajo con reintentos &rarr; <strong>SQS</strong>.", "Solo necesitás avisar a varios suscriptores sin filtrar &rarr; <strong>SNS</strong>, más barato.", "Flujos con pasos, condiciones y estado &rarr; <strong>Step Functions</strong>.", "Volumen altísimo de eventos: el costo por millón se acumula."],
      concepts: [{t:"Event bus",d:"Canal por donde circulan los eventos; el default recibe los de AWS."},{t:"Rule",d:"Patrón que filtra eventos y define a qué destino van."},{t:"Target",d:"Destino del evento: Lambda, SQS, Step Functions, API."},{t:"Schedule",d:"Regla con expresión cron o rate para ejecuciones periódicas."},{t:"Schema registry",d:"Catálogo de la estructura de los eventos que circulan."}] },
    { name: "Step Functions", d: "Orquestación visual de flujos serverless.", link: "https://aws.amazon.com/step-functions/",
      long: "<strong>Orquestador de flujos de trabajo</strong>: define una <strong>máquina de estados</strong> donde cada paso invoca una Lambda, un servicio de AWS o espera una acción. Maneja por vos las <strong>condiciones, ramas paralelas, reintentos, manejo de errores y esperas</strong> — nada de eso vive en el código de las funciones. Cada ejecución queda registrada paso a paso con su entrada y salida, lo que hace el debugging mucho más simple que rastrear Lambdas encadenadas a mano.",
      use: ["Encadenar varias Lambdas con lógica condicional entre pasos.", "Procesos de negocio largos: aprobaciones, onboarding, pipelines de datos.", "Reintentos y compensación cuando un paso intermedio falla.", "Flujos que esperan una acción humana o un evento externo antes de continuar."],
      avoid: ["Una sola función sin pasos intermedios &rarr; <strong>Lambda</strong> sola.", "Ruteo simple de eventos sin estado &rarr; <strong>EventBridge</strong>.", "Se cobra por transición de estado: flujos con muchísimos pasos y alto volumen salen caros.", "Procesamiento en streaming continuo &rarr; <strong>Kinesis</strong>."],
      concepts: [{t:"State machine",d:"La definición del flujo: pasos, condiciones y transiciones."},{t:"Task",d:"Paso que invoca una Lambda o un servicio de AWS."},{t:"Choice / Parallel / Map",d:"Estados para ramificar, ejecutar en paralelo o iterar sobre una lista."},{t:"Standard vs Express",d:"Standard dura hasta un año y cobra por transición; Express es para alto volumen y corta duración."},{t:"Retry / Catch",d:"Reintentos y manejo de errores declarados en el flujo, no en el código."}] },
  ]},
  { cat: "Herramientas dev", accent: "#E0C341", items: [
    { name: "CodeCommit", d: "Repos Git privados administrados.", link: "https://aws.amazon.com/codecommit/",
      long: "<strong>Repositorios Git privados</strong> administrados dentro de tu cuenta de AWS. Funciona con cualquier cliente Git y el control de acceso se hace con <strong>IAM</strong>, sin usuarios ni tokens aparte. Todo se cifra en reposo y en tránsito, y no hay límite de tamaño de repositorio. En la práctica la mayoría de los equipos usa GitHub o GitLab; CodeCommit tiene sentido cuando hay <strong>requisitos regulatorios</strong> de que el código no salga del entorno AWS.",
      use: ["Requisitos de cumplimiento que exigen mantener el código dentro de AWS.", "Controlar el acceso al repositorio con las mismas políticas de IAM del resto de la cuenta.", "Integración directa con CodePipeline sin credenciales externas.", "Entornos aislados sin acceso a internet público."],
      avoid: ["Tu equipo ya trabaja con GitHub o GitLab: son mejores en colaboración y ecosistema.", "Necesitás pull requests ricos, Actions o integraciones de terceros.", "Proyectos open source que necesitan visibilidad pública.", "AWS dejó de aceptar nuevos clientes en CodeCommit: para proyectos nuevos conviene GitHub."],
      concepts: [{t:"Repositorio",d:"Repo Git estándar; funciona con cualquier cliente."},{t:"Acceso por IAM",d:"Permisos gestionados con políticas, sin cuentas separadas."},{t:"Credenciales HTTPS Git",d:"Credenciales específicas generadas desde IAM para clonar."}] },
    { name: "CodePipeline", d: "Automatización de CI/CD.", link: "https://aws.amazon.com/codepipeline/",
      long: "<strong>Orquestador de CI/CD</strong>: define el pipeline por etapas — origen, compilación, pruebas, despliegue — y cada cambio en el repositorio lo dispara automáticamente. No compila ni despliega por sí mismo: <strong>coordina</strong> a CodeBuild, CodeDeploy, CloudFormation, ECS o Lambda, y puede integrar herramientas externas. Permite intercalar <strong>aprobaciones manuales</strong> antes de pasar a producción, y frena el pipeline si una etapa falla.",
      use: ["Despliegue automático a staging y producción en cada merge.", "Pipelines con aprobación manual antes del paso a producción.", "Coordinar el despliegue de varios servicios en orden.", "CI/CD dentro de AWS sin depender de un runner externo."],
      avoid: ["Ya usás GitHub Actions o GitLab CI y funcionan bien: suele haber poco que ganar.", "Pipelines simples de un proyecto chico: el setup es más pesado que un workflow de Actions.", "Necesitás una comunidad grande de acciones y plugins listos.", "Solo querés compilar y testear, sin desplegar &rarr; <strong>CodeBuild</strong> solo."],
      concepts: [{t:"Stage",d:"Etapa del pipeline: Source, Build, Test, Deploy."},{t:"Action",d:"Tarea concreta dentro de una etapa."},{t:"Artifact",d:"Lo que produce una etapa y consume la siguiente; se guarda en S3."},{t:"Manual approval",d:"Pausa el pipeline hasta que una persona lo autorice."}] },
    { name: "CodeBuild", d: "Compilación y testing administrado.", link: "https://aws.amazon.com/codebuild/",
      long: "Servicio de <strong>compilación y pruebas</strong> totalmente administrado: no hay servidores de build que mantener ni actualizar. Levanta un contenedor efímero, ejecuta los pasos definidos en el archivo <strong>buildspec.yml</strong> del repositorio, guarda los artefactos y se apaga. Se factura <strong>por minuto de compilación</strong>, así que no hay costo cuando nadie compila, y escala solo si veinte builds arrancan a la vez.",
      use: ["Compilar, testear y empaquetar la aplicación en cada commit.", "Construir imágenes Docker y publicarlas en ECR.", "Correr la suite de tests en un entorno limpio y reproducible.", "Builds paralelos sin dimensionar una flota de runners."],
      avoid: ["Ya tenés runners de GitHub Actions o GitLab funcionando bien.", "Builds muy largos y frecuentes: el costo por minuto se acumula.", "Necesitás hardware específico o un entorno muy particular.", "Coordinar el despliegue completo &rarr; <strong>CodePipeline</strong>."],
      concepts: [{t:"buildspec.yml",d:"Archivo en el repo que define las fases y comandos del build."},{t:"Build project",d:"Configuración: origen, imagen del entorno, variables, artefactos."},{t:"Entorno efímero",d:"Contenedor limpio por cada build; nada persiste entre ejecuciones."},{t:"Caché",d:"Guarda dependencias entre builds para acelerarlos."}] },
    { name: "CodeDeploy", d: "Automatiza despliegues a EC2, Lambda o ECS.", link: "https://aws.amazon.com/codedeploy/",
      long: "Automatiza el <strong>despliegue de la aplicación</strong> a instancias EC2, servidores on-premise, funciones Lambda o servicios ECS. Su aporte no es copiar archivos, sino <strong>controlar cómo se hace el cambio</strong>: desplegar de a poco, verificar la salud en cada paso y <strong>revertir automáticamente</strong> si algo falla. Soporta <strong>in-place</strong> (actualiza los servidores existentes) y <strong>blue/green</strong> (levanta un entorno nuevo y recién ahí manda el tráfico), además de despliegues canary.",
      use: ["Despliegues sin downtime sobre una flota de instancias EC2.", "Blue/green con reversión automática si los health checks fallan.", "Canary en Lambda: mandar el 10% del tráfico a la versión nueva y observar.", "Desplegar también a servidores on-premise con el mismo flujo."],
      avoid: ["Elastic Beanstalk o App Runner ya gestionan el despliegue por vos.", "Aplicación serverless simple: publicar la versión de Lambda alcanza.", "Kubernetes con su propia estrategia de rollout &rarr; herramientas del ecosistema.", "Solo necesitás compilar &rarr; <strong>CodeBuild</strong>."],
      concepts: [{t:"In-place vs Blue/Green",d:"In-place actualiza los servidores actuales; blue/green crea un entorno nuevo y cambia el tráfico."},{t:"Canary / Linear",d:"Mueve el tráfico de a porcentajes en vez de todo de golpe."},{t:"appspec.yml",d:"Archivo que define los pasos y hooks del despliegue."},{t:"Rollback automático",d:"Vuelve a la versión anterior si el despliegue falla o salta una alarma."}] },
    { name: "CloudFormation", d: "Infraestructura como código: define recursos en una plantilla.", link: "https://aws.amazon.com/cloudformation/",

  byId[id]=node; byName[svc.name]=node; totalServices++;
}));
document.getElementById('total').textContent = totalServices;

// resolve relations to ids
const relPairs = RELATIONS.filter(([a,b])=>byName[a]&&byName[b]).map(([a,b])=>[byName[a].id, byName[b].id]);
function relatedIds(id){
  const out = new Set();
  relPairs.forEach(([a,b])=>{ if(a===id) out.add(b); if(b===id) out.add(a); });
  return [...out];
}

let mode = 'radial';
let visualStyle = 'circle'; // 'circle' (original dot/orbit look) or 'cards' (compact card grid)
let selectedId = null;
const pos = {}; // id -> {x,y} in world coords (services)
const catPos = {}; // ci -> {x,y}

// ---------- card geometry (cards style) ----------
const CARD_W = 168, CARD_H = 54;

// ---------- layouts: circle style (original orbit look) ----------
function layoutRadialCircle(){
  const N = DATA.length;
  const R1 = 300, R2base = 560;
  DATA.forEach((cat,ci)=>{
    const a = (ci/N)*Math.PI*2 - Math.PI/2;
    catPos[ci] = { x: Math.cos(a)*R1, y: Math.sin(a)*R1, ang:a };
    const k = cat.items.length;
    const slice = (Math.PI*2/N)*0.82;
    cat.items.forEach((svc,si)=>{
      const off = k===1 ? 0 : (si-(k-1)/2)*(slice/(k));
      const aa = a + off;
      const r = R2base + (si%2)*46; // stagger to reduce overlap
      pos[`${ci}-${si}`] = { x: Math.cos(aa)*r, y: Math.sin(aa)*r, ang:aa };
    });
  });
}
function layoutGraphCircle(){
  // all services on a big circle, grouped by category contiguously
  const R = 520;
  let idxList = [];
  DATA.forEach((cat,ci)=>cat.items.forEach((svc,si)=>idxList.push(`${ci}-${si}`)));
  const M = idxList.length;
  idxList.forEach((id,i)=>{
    const a = (i/M)*Math.PI*2 - Math.PI/2;
    pos[id] = { x: Math.cos(a)*R, y: Math.sin(a)*R, ang:a };
  });
}

// ---------- layouts: cards style (grid-based, compact, no overlap) ----------
function layoutRadialCards(){
  // one column per category, cards stacked vertically — compact & non-overlapping
  const N = DATA.length;
  const COLW = CARD_W + 64;
  const totalW = (N-1)*COLW;
  const startX = -totalW/2;
  DATA.forEach((cat,ci)=>{
    const cx = startX + ci*COLW;
    const headerY = 0;
    catPos[ci] = { x: cx, y: headerY };
    const rowGap = CARD_H + 14;
    const startY = headerY + 55;
    cat.items.forEach((svc,si)=>{
      pos[`${ci}-${si}`] = { x: cx, y: startY + si*rowGap };
    });
  });
}
function layoutGraphCards(){
  // grid layout: wrap cards into rows, grouped by category contiguously
  const COLS = 8;
  const COLW = CARD_W + 40, ROWH = CARD_H + 34;
  let idxList = [];
  DATA.forEach((cat,ci)=>cat.items.forEach((svc,si)=>idxList.push(`${ci}-${si}`)));
  const M = idxList.length;
  const rows = Math.ceil(M/COLS);
  const totalW = (COLS-1)*COLW, totalH = (rows-1)*ROWH;
  idxList.forEach((id,i)=>{
    const col = i%COLS, row = Math.floor(i/COLS);
    pos[id] = { x: -totalW/2 + col*COLW, y: -totalH/2 + row*ROWH };
  });
}

function curve(x1,y1,x2,y2,pull){
  if(pull==null){ const mx=(x1+x2)/2, my=(y1+y2)/2; return `M ${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`; }
  const cx = (x1+x2)/2*pull, cy=(y1+y2)/2*pull;
  return `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
}
function el(tag,attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

// draws a compact rectangular "card" node at (p.x,p.y) for service svc/id
function drawCard(nodes, id, svc, accent, dim, hlActive){
  const p = pos[id];
  const g = el('g',{ transform:`translate(${p.x - CARD_W/2},${p.y - CARD_H/2})`, style:'cursor:pointer' });
  g.setAttribute('data-id', id);

  const bg = el('rect',{ x:0, y:0, width:CARD_W, height:CARD_H, rx:8,
    fill: hlActive ? '#151d2b' : '#101722',
    stroke: hlActive ? accent : '#25313f',
    'stroke-width': hlActive ? 1.6 : 1, opacity: dim });
  g.appendChild(bg);

  // left accent bar
  g.appendChild(el('rect',{ x:0, y:0, width:4, height:CARD_H, rx:2, fill:accent, opacity:dim }));

  // category label (tiny, top)
  const catT = el('text',{ x:14, y:16, fill:accent, 'font-size':8.5, 'font-weight':700, 'letter-spacing':'.03em',
    'font-family':'var(--sans)', opacity:dim*0.9 });
  catT.textContent = (cat_of(id)||'').toUpperCase();
  g.appendChild(catT);

  // service name
  const nameT = el('text',{ x:14, y:33, fill:'#e7ecf2', 'font-size':13.5, 'font-weight':600,
    'font-family':'var(--sans)', opacity:dim });
  nameT.textContent = svc.name;
  g.appendChild(nameT);

  // bottom row: one-line description snippet
  const descT = el('text',{ x:14, y:46, fill:'#7c8ca0', 'font-size':9.5, 'font-family':'var(--mono)', opacity:dim*0.85 });
  const snippet = svc.d.length>34 ? svc.d.slice(0,32)+'…' : svc.d;
  descT.textContent = snippet;
  g.appendChild(descT);

  g.addEventListener('click',(e)=>{ e.stopPropagation(); openPanel(id); });
  nodes.appendChild(g);
}
function cat_of(id){ const [ci] = id.split('-'); return DATA[+ci] && DATA[+ci].cat; }

function edgeAnchor(p, side){
  // connect from card edge (left/right) instead of center, for cleaner routing
  if(side==='right') return { x:p.x+CARD_W/2, y:p.y };
  if(side==='left') return { x:p.x-CARD_W/2, y:p.y };
  return { x:p.x, y:p.y+CARD_H/2 };
}

function render(){
  svg.innerHTML='';
  vp = el('g',{}); svg.appendChild(vp);
  const edges = el('g',{}); const nodes = el('g',{});
  vp.appendChild(edges); vp.appendChild(nodes);

  const hl = selectedId ? new Set([selectedId, ...relatedIds(selectedId)]) : null;

  if(visualStyle === 'cards'){
    if(mode==='radial'){
      layoutRadialCards();
      // category header cards
      DATA.forEach((cat,ci)=>{
        const c = catPos[ci];
        const g = el('g',{ transform:`translate(${c.x-CARD_W/2},${c.y-18})` });
        g.appendChild(el('rect',{ x:0, y:0, width:CARD_W, height:30, rx:7, fill:'#131a26', stroke:cat.accent, 'stroke-width':1.2, opacity:.9 }));
        const t = el('text',{ x:CARD_W/2, y:19, fill:cat.accent, 'font-size':12, 'font-weight':700, 'text-anchor':'middle', 'font-family':'var(--sans)' });
        t.textContent = cat.cat;
        g.appendChild(t);
        nodes.appendChild(g);
        // connector from header down to first card
        const p0 = pos[`${ci}-0`];
        if(p0) edges.appendChild(el('path',{ d: curve(c.x,c.y-3,p0.x,p0.y-CARD_H/2), stroke:cat.accent, 'stroke-width':1.5, fill:'none', 'stroke-dasharray':'2 4', opacity:.4 }));
      });
      // vertical connectors between cards in same column
      DATA.forEach((cat,ci)=>{
        for(let si=0; si<cat.items.length-1; si++){
          const a = pos[`${ci}-${si}`], b = pos[`${ci}-${si+1}`];
          edges.appendChild(el('path',{ d:`M ${a.x} ${a.y+CARD_H/2} L ${b.x} ${b.y-CARD_H/2}`, stroke:cat.accent, 'stroke-width':1, fill:'none', 'stroke-dasharray':'2 4', opacity:.25 }));
        }
      });
      DATA.forEach((cat,ci)=>cat.items.forEach((svc,si)=>{
        const id=`${ci}-${si}`;
        const dim = hl && !hl.has(id) ? .28 : 1;
        drawCard(nodes, id, svc, cat.accent, dim, hl && hl.has(id));
      }));
    } else {
      layoutGraphCards();
      // relationship edges — dotted, curved, AWS-doc-style
      relPairs.forEach(([a,b])=>{
        const pa=pos[a], pb=pos[b];
        const active = hl && (hl.has(a)&&hl.has(b));
        const dim = hl ? (active?1:.06) : .75;
        const col = active ? '#4DD9C5' : '#5a6a80';
        const A = edgeAnchor(pa, pa.x<pb.x?'right':'left');
        const B = edgeAnchor(pb, pb.x<pa.x?'right':'left');
        edges.appendChild(el('path',{ d: curve(A.x,A.y,B.x,B.y,0.5), stroke:col, 'stroke-width':active?2:1.3, fill:'none', 'stroke-dasharray': active?'none':'3 3', opacity:dim }));
      });
      DATA.forEach((cat,ci)=>cat.items.forEach((svc,si)=>{
        const id=`${ci}-${si}`;
        const dim = hl && !hl.has(id) ? .22 : 1;
        drawCard(nodes, id, svc, cat.accent, dim, hl && hl.has(id));
      }));
    }
    applyTransform();
    return;
  }

  // ---------- circle style (original orbit look) ----------
  if(mode==='radial'){
    layoutRadialCircle();
    // AWS -> category edges
    DATA.forEach((cat,ci)=>{
      const c = catPos[ci];
      edges.appendChild(el('path',{ d: curve(0,0,c.x,c.y), stroke:cat.accent, 'stroke-width':4.5, fill:'none', 'stroke-linecap':'round', opacity:.85 }));
      // category -> service edges
      cat.items.forEach((svc,si)=>{
        const p = pos[`${ci}-${si}`];
        edges.appendChild(el('path',{ d: curve(c.x,c.y,p.x,p.y), stroke:cat.accent, 'stroke-width':2, fill:'none', 'stroke-linecap':'round', opacity:.45 }));
      });
    });
    // category labels
    DATA.forEach((cat,ci)=>{
      const c = catPos[ci];
      const g = el('g',{ transform:`translate(${c.x},${c.y})`, class:'catnode', style:'cursor:pointer' });
      const t = el('text',{ x:0, y:0, fill:cat.accent, 'font-size':16, 'font-weight':700, 'text-anchor':'middle', 'dominant-baseline':'middle', 'font-family':'var(--sans)' });
      t.textContent = cat.cat;
      g.appendChild(t);
      nodes.appendChild(g);
    });
    // service labels
    DATA.forEach((cat,ci)=>cat.items.forEach((svc,si)=>{
      const id=`${ci}-${si}`; const p=pos[id];
      const right = p.x>=0;
      const g = el('g',{ transform:`translate(${p.x},${p.y})`, style:'cursor:pointer' });
      g.setAttribute('data-id', id);
      const dim = hl && !hl.has(id) ? .28 : 1;
      const t = el('text',{ x: right?8:-8, y:0, fill:'#e7ecf2', 'font-size':13, 'text-anchor': right?'start':'end', 'dominant-baseline':'middle', 'font-family':'var(--mono)', opacity:dim });
      t.textContent = svc.name;
      const dot = el('circle',{ cx:0, cy:0, r:3.5, fill:cat.accent, opacity:dim });
      g.appendChild(dot); g.appendChild(t);
      g.addEventListener('click',(e)=>{e.stopPropagation();openPanel(id);});
      nodes.appendChild(g);
    }));
  } else {
    layoutGraphCircle();
    // relationship chords
    relPairs.forEach(([a,b])=>{
      const pa=pos[a], pb=pos[b];
      const active = hl && (hl.has(a)&&hl.has(b));
      const dim = hl ? (active?1:.08) : .32;
      const col = active ? '#4DD9C5' : '#3a4757';
      edges.appendChild(el('path',{ d: curve(pa.x,pa.y,pb.x,pb.y,0.18), stroke:col, 'stroke-width':active?2:1.2, fill:'none', opacity:dim }));
    });
    // service nodes
    DATA.forEach((cat,ci)=>cat.items.forEach((svc,si)=>{
      const id=`${ci}-${si}`; const p=pos[id];
      const right = p.x>=0;
      const dim = hl && !hl.has(id) ? .25 : 1;
      const g = el('g',{ transform:`translate(${p.x},${p.y}) rotate(${p.ang*180/Math.PI + (right?0:180)})`, style:'cursor:pointer' });
      const t = el('text',{ x: right?10:-10, y:0, fill: (hl&&hl.has(id))?cat.accent:'#c9d3de', 'font-size':12, 'text-anchor': right?'start':'end', 'dominant-baseline':'middle', 'font-family':'var(--mono)', opacity:dim });
      t.textContent = svc.name;
      const dot = el('circle',{ cx:0, cy:0, r:4, fill:cat.accent, opacity:dim, transform:`rotate(${-(p.ang*180/Math.PI + (right?0:180))})` });
      g.appendChild(dot); g.appendChild(t);
      g.addEventListener('click',(e)=>{e.stopPropagation();openPanel(id);});
      nodes.appendChild(g);
    }));
  }

  // AWS center node (drawn last, on top) — only meaningful in circle style
  const cg = el('g',{});
  const rectW=190, rectH=52;
  cg.appendChild(el('rect',{ x:-rectW/2, y:-rectH/2, width:rectW, height:rectH, rx:12, fill:'#0f1520', stroke:'#4d5a6c', 'stroke-width':1.5 }));
  const ct = el('text',{ x:0, y:0, fill:'#e7ecf2', 'font-size':18, 'font-weight':700, 'text-anchor':'middle', 'dominant-baseline':'middle', 'font-family':'var(--sans)' });
  ct.textContent='Amazon Web Services';
  cg.appendChild(ct); vp.appendChild(cg);

  applyTransform();
}

// ---------- pan / zoom ----------
let tx=0, ty=0, scale=1;
function applyTransform(){ if(vp) vp.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`); }
function fit(){
  const w=stage.clientWidth, h=stage.clientHeight;
  if(visualStyle==='cards'){
    // compute actual bounding box of current positions so scale matches the grid layout, not a hardcoded guess
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    Object.values(pos).forEach(p=>{
      minX=Math.min(minX,p.x-CARD_W/2); maxX=Math.max(maxX,p.x+CARD_W/2);
      minY=Math.min(minY,p.y-CARD_H/2-40); maxY=Math.max(maxY,p.y+CARD_H/2);
    });
    const contentW = (maxX-minX)||1, contentH=(maxY-minY)||1;
    scale = Math.min(w/contentW, h/contentH) * 0.9;
    scale = Math.max(.25, Math.min(scale, 1.4));
    tx = w/2 - (minX+maxX)/2*scale; ty = h/2 - (minY+maxY)/2*scale;
  } else {
    // circle style: fixed reference sizes calibrated to the orbit layout radii
    scale = Math.min(w,h)/ (mode==='radial'?1500:1300);
    scale = Math.max(.35, Math.min(scale, 1));
    tx = w/2; ty = h/2;
  }
  applyTransform();
}
let dragging=false, sx, sy;
stage.addEventListener('mousedown',(e)=>{ dragging=true; sx=e.clientX-tx; sy=e.clientY-ty; });
window.addEventListener('mousemove',(e)=>{ if(!dragging)return; tx=e.clientX-sx; ty=e.clientY-sy; applyTransform(); });
window.addEventListener('mouseup',()=>dragging=false);
stage.addEventListener('wheel',(e)=>{ e.preventDefault(); const f=e.deltaY<0?1.1:1/1.1; const rect=stage.getBoundingClientRect(); const mx=e.clientX-rect.left, my=e.clientY-rect.top; tx = mx-(mx-tx)*f; ty = my-(my-ty)*f; scale*=f; scale=Math.max(.2,Math.min(scale,3)); applyTransform(); },{passive:false});
// touch pan
let lastT=null;
stage.addEventListener('touchstart',(e)=>{ if(e.touches.length===1){ lastT={x:e.touches[0].clientX-tx,y:e.touches[0].clientY-ty}; } },{passive:true});
stage.addEventListener('touchmove',(e)=>{ if(e.touches.length===1&&lastT){ tx=e.touches[0].clientX-lastT.x; ty=e.touches[0].clientY-lastT.y; applyTransform(); } },{passive:true});
document.getElementById('zin').addEventListener('click',()=>{ scale=Math.min(scale*1.2,3); applyTransform(); });
document.getElementById('zout').addEventListener('click',()=>{ scale=Math.max(scale/1.2,.2); applyTransform(); });
document.getElementById('zfit').addEventListener('click',fit);

// ---------- detail panel ----------
const panel=document.getElementById('panel'), scrim=document.getElementById('scrim');
function fillList(boxId,listId,items){
  const box=document.getElementById(boxId), list=document.getElementById(listId);
  box.open=false; // siempre colapsado al abrir un servicio
  if(items&&items.length){ box.style.display='block'; list.innerHTML=items.map(t=>`<li>${t}</li>`).join(''); }
  else { box.style.display='none'; list.innerHTML=''; }
}
function openPanel(id){
  selectedId=id; const c=byId[id];
  document.getElementById('pCat').textContent=c.cat;
  document.getElementById('pCat').style.color=c.accent;
  document.getElementById('pName').textContent=c.name;
  document.getElementById('pDesc').textContent=c.d;
  document.getElementById('pLong').innerHTML=c.long||'';
  fillList('pUse','pUseList',c.use);
  fillList('pAvoid','pAvoidList',c.avoid);
  const conBlk=document.getElementById('pConceptsBlk'), conBox=document.getElementById('pConcepts');
  conBlk.open=false;
  if(c.concepts&&c.concepts.length){ conBlk.style.display='block'; conBox.innerHTML=c.concepts.map(k=>`<dt>${k.t}</dt><dd>${k.d}</dd>`).join(''); }
  else { conBlk.style.display='none'; conBox.innerHTML=''; }
  panel.style.setProperty('--pc-accent',c.accent);
  const rels=relatedIds(id);
  const relLbl=document.getElementById('pRelLbl'), relBox=document.getElementById('pRel');
  if(rels.length){ relLbl.style.display='block'; relBox.innerHTML=rels.map(rid=>`<span class="chipr" data-id="${rid}">${byId[rid].name}</span>`).join(''); relBox.querySelectorAll('.chipr').forEach(ch=>ch.addEventListener('click',()=>openPanel(ch.dataset.id))); }
  else { relLbl.style.display='none'; relBox.innerHTML=''; }
  document.getElementById('pLink').href=c.link;
  document.getElementById('pNotes').value=notes[id]||'';
  panel.classList.add('open'); scrim.classList.add('open');
  render();
}
function closePanel(){ panel.classList.remove('open'); scrim.classList.remove('open'); selectedId=null; render(); }
document.getElementById('panelClose').addEventListener('click',closePanel);
scrim.addEventListener('click',closePanel);
document.getElementById('pNotes').addEventListener('input',(e)=>{ if(!selectedId)return; notes[selectedId]=e.target.value; saveNotes(); });

// ---------- modes (radial vs relaciones) ----------
document.querySelectorAll('.modebtn[data-mode]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.modebtn[data-mode]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  mode=b.dataset.mode;
  document.getElementById('modehint').textContent = mode==='radial'
    ? 'arrastrá para mover · rueda para zoom · click en un servicio para ver detalle'
    : 'cada línea es una relación real entre servicios · click en uno para resaltar sus conexiones';
  selectedId=null; render(); fit();
}));

// ---------- visual style (círculo vs cards) ----------
document.querySelectorAll('.modebtn[data-style]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.modebtn[data-style]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  visualStyle=b.dataset.style;
  selectedId=null; render(); fit();
}));

// deselect on background click
svg.addEventListener('click',()=>{ if(selectedId){ selectedId=null; render(); }});

// ---------- init ----------
(async function init(){
  await loadState();
  render();
  fit();
})();
window.addEventListener('resize',()=>{ render(); });
</script>
</body>
</html>
