const DATA = [
  { cat: "Cómputo", accent: "#F5A623", items: [
    { name: "EC2", d: "Máquinas virtuales redimensionables bajo demanda; on-demand, reserved o spot.", link: "https://aws.amazon.com/ec2/",
      long: "<strong>Servidores virtuales</strong> bajo demanda: elegís sistema operativo, CPU, memoria y red, y en minutos tenés una máquina corriendo. Es el servicio de cómputo más antiguo y flexible de AWS, y la base sobre la que se apoyan muchos otros. Su contracara es que <strong>vos administrás el sistema operativo</strong>: parches, actualizaciones y seguridad puertas adentro corren por tu cuenta. El precio cambia radicalmente según el <strong>modelo de compra</strong> que elijas.",

    { name: "Lambda", d: "Ejecutá código sin administrar servidores; se factura por invocación y tiempo.", link: "https://aws.amazon.com/lambda/",
      long: "Cómputo <strong>serverless</strong>: escribís una función, la conectás a un <strong>trigger</strong> (API Gateway, S3, SQS, EventBridge y más de 200 servicios) y AWS la ejecuta. No aprovisionás ni parcheás nada; la infraestructura, el escalado y la tolerancia a fallos los maneja el servicio. Cada invocación corre <strong>aislada y sin estado compartido</strong>, y escala horizontalmente sola con la demanda. Pagás por invocación y por tiempo de ejecución: sin tráfico, no pagás nada.",
      use: ["Backend de una API serverless, detrás de API Gateway.", "Procesar un archivo apenas se sube a S3 (miniaturas, ETL, validaciones).", "Tareas programadas y automatizaciones de infraestructura.", "Consumir mensajes de SQS o eventos de EventBridge entre microservicios."],

    { name: "Batch", d: "Procesamiento por lotes a escala sobre EC2/Fargate.", link: "https://aws.amazon.com/batch/",

    { name: "Lightsail", d: "VPS simplificado con precio fijo mensual.", link: "https://aws.amazon.com/lightsail/",
      long: "<strong>Servidor privado virtual (VPS)</strong> con <strong>precio fijo mensual</strong> y una consola simplificada aparte de la de AWS. Cada plan incluye instancia, almacenamiento SSD y una cuota de transferencia, todo por un monto conocido de antemano — sin la sorpresa de la factura variable típica de AWS. Trae imágenes listas de WordPress, LAMP, Node y otras. Es la puerta de entrada más simple, pensada para competir con DigitalOcean o Linode.",

      avoid: ["El proyecto va a crecer y necesitar servicios de AWS integrados &rarr; <strong>EC2</strong> dentro de una VPC.", "Necesitás Auto Scaling, Multi-AZ o arquitecturas complejas: Lightsail no llega ahí.", "Cargas variables donde el precio fijo termina siendo más caro que pagar por uso.", "Apps contenerizadas con orquestación &rarr; <strong>ECS</strong> o <strong>App Runner</strong>."],

      use: ["Ya tenés cargas en Kubernetes y querés moverlas a AWS sin reescribirlas.", "Necesitás portabilidad entre nubes o un entorno híbrido.", "Querés usar el ecosistema Kubernetes: Helm, operadores, service mesh, CRDs.", "Equipos grandes con plataforma propia y experiencia en Kubernetes."],
      avoid: ["Equipo chico sin experiencia en Kubernetes &rarr; <strong>ECS</strong>, mucho menos carga operativa.", "Una app simple que solo necesita estar en línea &rarr; <strong>App Runner</strong>.", "El plano de control se paga por hora aunque el cluster esté ocioso.", "No necesitás portabilidad: ECS resuelve lo mismo con menos piezas."],
      concepts: [{t:"Control plane",d:"Los maestros de Kubernetes, administrados por AWS y facturados por hora."},{t:"Node group",d:"Conjunto de nodos EC2 donde corren tus pods."},{t:"Pod",d:"La unidad mínima de Kubernetes: uno o más contenedores que comparten red."},{t:"Fargate profile",d:"Regla que hace que ciertos pods corran sin nodos EC2."},{t:"IRSA",d:"IAM Roles for Service Accounts: da permisos de AWS a un pod puntual."}] },
    { name: "ECR", d: "Registro privado de imágenes de contenedores.", link: "https://aws.amazon.com/ecr/",
      long: "<strong>Registro privado de imágenes</strong> de contenedores, el equivalente a Docker Hub pero dentro de tu cuenta. Guarda las imágenes que construís y las sirve a ECS, EKS, Fargate, App Runner o Lambda. Los permisos se controlan con <strong>IAM</strong> —no con credenciales aparte— y todas las imágenes se cifran en reposo. Incluye <strong>escaneo de vulnerabilidades</strong> sobre las capas de cada imagen y reglas de ciclo de vida para borrar automáticamente las versiones viejas.",
      use: ["Guardar las imágenes Docker de tus servicios de forma privada.", "Que ECS o EKS levanten imágenes sin salir a internet ni exponer credenciales.", "Detectar CVEs en tus imágenes antes de desplegarlas a producción.", "Limpiar solo las imágenes viejas con reglas de ciclo de vida."],
      avoid: ["Querés publicar una imagen open source para todo el mundo &rarr; Docker Hub o ECR Public.", "No usás contenedores: no hay nada que registrar.", "Almacenar artefactos que no son imágenes (jars, zips) &rarr; <strong>S3</strong> o CodeArtifact."],
      concepts: [{t:"Repository",d:"Contenedor de todas las versiones de una imagen."},{t:"Tag",d:"Etiqueta de versión (latest, v1.2.0) que identifica cada imagen."},{t:"Image scanning",d:"Análisis de vulnerabilidades conocidas en las capas de la imagen."},{t:"Lifecycle policy",d:"Regla que borra imágenes viejas o sin tag automáticamente."}] },
    { name: "Fargate", d: "Cómputo serverless para contenedores: no gestionás las instancias.", link: "https://aws.amazon.com/fargate/",
      long: "<strong>Motor de cómputo serverless para contenedores</strong>. No es un orquestador aparte: es un <strong>modo de capacidad</strong> de ECS y EKS. Con Fargate desaparecen las instancias EC2 del cluster — declarás cuánta CPU y memoria necesita cada tarea y AWS provee exactamente eso, aislado a nivel de máquina virtual. <strong>Se paga por vCPU y GB por segundo</strong> mientras la tarea corre, así que no hay capacidad ociosa; a cambio, el precio por unidad de cómputo es mayor que el de una EC2 bien aprovechada.",
      use: ["Correr contenedores sin administrar, parchear ni dimensionar servidores.", "Cargas variables o con picos donde tener EC2 encendidas de más sale caro.", "Equipos chicos que no quieren operar un cluster de instancias.", "Aislamiento fuerte entre tareas: cada una corre en su propia microVM."],
      avoid: ["Cargas grandes y constantes: EC2 reservada o Spot sale bastante más barato.", "Necesitás GPU o tipos de instancia específicos &rarr; nodos <strong>EC2</strong> en el cluster.", "Requerís acceso al host, montar dispositivos o usar DaemonSets.", "Contenedores que arrancan y mueren en segundos, muy seguido &rarr; <strong>Lambda</strong>."],
      concepts: [{t:"Modo de capacidad",d:"Fargate no reemplaza a ECS ni EKS: es dónde corren sus tareas."},{t:"Task size",d:"CPU y memoria declaradas por tarea; se paga exactamente eso."},{t:"Sin acceso al host",d:"No hay servidor donde entrar: AWS lo administra por completo."},{t:"Fargate Spot",d:"Capacidad interrumpible y más barata para cargas que toleran cortes."}] },
  ]},
  { cat: "Almacenamiento", accent: "#4DD9C5", items: [
    { name: "S3", d: "Almacenamiento de objetos con 11 nueves de durabilidad; clases según acceso.", link: "https://aws.amazon.com/s3/",
      long: "Almacenamiento de <strong>objetos</strong>: guardás archivos completos (imágenes, videos, backups, logs, datasets) y los recuperás por una API HTTP, no montando un disco. Escala prácticamente sin límite y es la base de data lakes, hosting de sitios estáticos, backups y analítica. Ofrece varias <strong>clases de almacenamiento</strong> para pagar según cuán seguido accedas a cada objeto.",
      use: ["Hosting de sitios estáticos y assets servidos por CloudFront.", "Data lake: archivos crudos que después consultás con Athena o Redshift.", "Backups y logs que se escriben una vez y se leen poco.", "Recibir uploads de usuarios desde una app web o móvil."],
      avoid: ["Necesitás montar un filesystem y usar rutas POSIX &rarr; <strong>EFS</strong>.", "Un solo servidor necesita un disco rápido dedicado &rarr; <strong>EBS</strong>.", "Escrituras parciales dentro de un archivo: en S3 se reemplaza el objeto entero.", "Base de datos transaccional &rarr; <strong>RDS</strong> o <strong>DynamoDB</strong>."],
      concepts: [{t:"Bucket",d:"Contenedor raíz de los objetos. Vive en una región."},{t:"Objeto / key",d:"El archivo y su nombre completo dentro del bucket."},{t:"Storage class",d:"Standard, Intelligent-Tiering, Standard-IA, One Zone-IA, Glacier: distinto costo según frecuencia de acceso."},{t:"Lifecycle policy",d:"Regla que mueve o borra objetos solos con el tiempo (ej. a Glacier a los 90 días)."},{t:"Versioning",d:"Guarda revisiones anteriores de un objeto; protege contra borrado accidental."}] },
    { name: "EBS", d: "Volúmenes de bloque persistentes para instancias EC2.", link: "https://aws.amazon.com/ebs/",
      long: "Almacenamiento de <strong>bloque</strong> para instancias EC2: se comporta como un disco duro conectado a la máquina. Persiste aunque reinicies la instancia. Los volúmenes se replican automáticamente dentro de <strong>una sola Availability Zone</strong>, y podés cambiar capacidad o rendimiento en caliente, sin downtime. Hay tipos <strong>SSD</strong> (cargas transaccionales) y <strong>HDD</strong> (mucho throughput secuencial).",
      use: ["Disco raíz del sistema operativo de una EC2.", "Base de datos corriendo sobre EC2, que necesita I/O de baja latencia.", "Cualquier app que espera un disco local y no se puede reescribir.", "Backups puntuales del disco vía snapshots."],
      avoid: ["Varias EC2 tienen que escribir los mismos archivos a la vez &rarr; <strong>EFS</strong>.", "Guardás objetos accesibles por HTTP &rarr; <strong>S3</strong>.", "Necesitás que el disco sobreviva la caída de una AZ: EBS vive en una sola AZ."],
      concepts: [{t:"Volumen",d:"El disco en sí, que se adjunta a una instancia."},{t:"Snapshot",d:"Copia puntual del volumen, guardada aparte; restaurable en otra AZ o cuenta."},{t:"SSD vs HDD",d:"SSD (gp3, io2) para transaccional; HDD (st1, sc1) para throughput secuencial barato."},{t:"Elastic Volumes",d:"Cambiar tamaño o rendimiento del volumen sin detener la instancia."}] },
    { name: "EFS", d: "Sistema de archivos elástico compartido entre instancias.", link: "https://aws.amazon.com/efs/",
      long: "Sistema de archivos <strong>serverless y elástico</strong>: crece y se achica solo, sin aprovisionar capacidad. Habla el protocolo <strong>NFS</strong>, así que se monta como cualquier filesystem de red y las herramientas de Linux funcionan sin cambios. Varias instancias lo montan <strong>al mismo tiempo</strong>, con consistencia fuerte y bloqueo de archivos. Accesible desde EC2, ECS, EKS, Lambda y Fargate.",
      use: ["Varias EC2 leen y escriben los mismos archivos simultáneamente.", "CMS o app web en cluster donde los uploads deben verse desde cualquier instancia.", "Cargas que ya usan filesystem y no se pueden migrar a una API de objetos.", "Almacenamiento compartido para contenedores ECS/EKS."],
      avoid: ["Un solo servidor con un disco dedicado y rápido &rarr; <strong>EBS</strong>.", "Objetos accedidos por HTTP: imágenes, backups, data lake &rarr; <strong>S3</strong>, más barato.", "Filesystem de <strong>Windows</strong> (SMB) o alto rendimiento tipo Lustre &rarr; <strong>FSx</strong>. EFS no soporta EC2 Windows.", "Archivado de largo plazo con acceso muy raro &rarr; <strong>S3 Glacier</strong>."],
      concepts: [{t:"Mount target",d:"Punto de acceso dentro de una subnet de la VPC. Sin él, la instancia no puede montar."},{t:"Regional vs One Zone",d:"Regional replica entre varias AZ y sobrevive la caída de una; One Zone es más barato pero vive en una sola."},{t:"Performance mode",d:"General Purpose es el default, para cargas sensibles a latencia."},{t:"Throughput mode",d:"Elastic escala el rendimiento solo según la actividad."},{t:"Encryption at rest",d:"Se activa al CREAR el filesystem, no después."}] },
    { name: "FSx", d: "Sistemas de archivos administrados (Windows, Lustre, NetApp, OpenZFS).", link: "https://aws.amazon.com/fsx/",
      long: "Familia de sistemas de archivos administrados para cuando necesitás un filesystem <strong>concreto</strong>, no uno genérico. Cuatro sabores: <strong>Windows File Server</strong> (SMB, se integra con Active Directory), <strong>Lustre</strong> (HPC y machine learning, altísimo throughput), <strong>NetApp ONTAP</strong> y <strong>OpenZFS</strong>. AWS se encarga del hardware, backups y parches.",
      use: ["Aplicaciones Windows que necesitan recursos compartidos SMB y Active Directory.", "HPC, simulaciones o entrenamiento de ML que leen datasets enormes muy rápido (Lustre).", "Migrar un NAS on-premise de NetApp o ZFS a AWS sin cambiar la app."],
      avoid: ["Filesystem Linux genérico y compartido &rarr; <strong>EFS</strong>, más simple y elástico.", "Objetos por HTTP &rarr; <strong>S3</strong>.", "Disco de una sola instancia &rarr; <strong>EBS</strong>."],
      concepts: [{t:"FSx for Windows",d:"SMB nativo + integración con Active Directory."},{t:"FSx for Lustre",d:"Filesystem paralelo de alto rendimiento; se enlaza con un bucket S3."},{t:"FSx for ONTAP / OpenZFS",d:"Compatibilidad con NAS existentes: snapshots, clones, dedupe."}] },
    { name: "S3 Glacier", d: "Almacenamiento frío de bajo costo para archivo a largo plazo.", link: "https://aws.amazon.com/s3/storage-classes/glacier/",
      long: "Las clases de almacenamiento <strong>más baratas</strong> de S3, pensadas para datos que casi nunca se leen pero hay que conservar. El precio por GB es mucho menor que S3 Standard; a cambio, recuperar un objeto cuesta plata y puede tardar. Tres niveles: <strong>Instant Retrieval</strong> (acceso en milisegundos), <strong>Flexible Retrieval</strong> (minutos a horas) y <strong>Deep Archive</strong> (el más barato, horas).",
      use: ["Backups que se guardan por años y ojalá nunca se lean.", "Retención por cumplimiento normativo o legal.", "Archivo histórico de logs o registros médicos/financieros.", "Destino de una lifecycle policy que baja objetos viejos desde S3 Standard."],
      avoid: ["Los datos se leen seguido: el costo de recuperación se te come el ahorro.", "Necesitás el archivo en el acto y no podés esperar &rarr; S3 Standard o Instant Retrieval.", "Es una clase de S3, no un servicio aparte: no lo montás como disco."],
      concepts: [{t:"Instant Retrieval",d:"Archivado con acceso en milisegundos; el más caro de los tres."},{t:"Flexible Retrieval",d:"Recuperación en minutos u horas según la urgencia que pidas."},{t:"Deep Archive",d:"El más barato; recuperación en horas. Para retención de 7-10 años."},{t:"Retrieval fee",d:"Sacar datos se cobra aparte del almacenamiento. Clave del modelo de costos."}] },
    { name: "Storage Gateway", d: "Puente híbrido entre almacenamiento on-premise y AWS.", link: "https://aws.amazon.com/storagegateway/",
      long: "Servicio <strong>híbrido</strong>: corrés un appliance virtual en tu datacenter que expone protocolos locales (NFS, SMB, iSCSI, VTL) mientras guarda los datos en <strong>S3, Glacier o EBS</strong> por detrás. Los servidores on-premise creen que hablan con un NAS local; en realidad escriben a AWS. Mantiene un caché local de lo más usado para que la latencia no se note.",
      use: ["Migrar backups on-premise a la nube sin cambiar el software de backup.", "Extender la capacidad de un NAS local usando S3 como fondo infinito.", "Reemplazar una librería de cintas física por Virtual Tape Library.", "Etapa intermedia de una migración gradual a AWS."],
      avoid: ["Todo tu stack ya corre en AWS: no hay nada on-premise que puentear.", "Migración masiva de datos por única vez &rarr; <strong>Snowball</strong> o DataSync.", "Necesitás rendimiento local puro sin dependencia de red."],
      concepts: [{t:"File Gateway",d:"Expone NFS/SMB y guarda cada archivo como objeto en S3."},{t:"Volume Gateway",d:"Expone volúmenes iSCSI respaldados por snapshots en EBS."},{t:"Tape Gateway",d:"Emula una librería de cintas; el software de backup no se entera."},{t:"Caché local",d:"Guarda los datos calientes on-premise para bajar latencia."}] },
  ]},
  { cat: "Migración y transferencia", accent: "#7FD4C1", items: [
    { name: "Snow Family", d: "Dispositivos físicos para mover datos a AWS sin usar la red.", link: "https://aws.amazon.com/snow/",
      long: "Dispositivos <strong>físicos</strong> que AWS te envía por correo para mover grandes volúmenes de datos <strong>sin depender de la red</strong>. Copiás los datos al equipo, lo devolvés y AWS los carga a S3. La lógica es simple: transferir <strong>petabytes por internet puede tardar meses</strong>, mientras que un camión tarda días. <strong>Snowcone</strong> es el más chico (hasta 8 TB) y <strong>Snowball Edge</strong> el intermedio (decenas de TB), que además puede <strong>procesar datos en el borde</strong>, en lugares sin conectividad. Todo viaja cifrado.",
      use: ["Migrar cientos de TB o petabytes a AWS en un plazo razonable.", "Ubicaciones con conexión lenta, cara o inexistente.", "Recolectar datos en el borde: barcos, minas, plantas industriales.", "Cuando el cálculo da que por red tardaría meses."],
      avoid: ["Volúmenes chicos o medianos &rarr; transferir por red directamente.", "Necesitás sincronización continua, no una carga única &rarr; <strong>DataSync</strong>.", "Conexión dedicada permanente &rarr; <strong>Direct Connect</strong>.", "Los datos se necesitan en la nube ya mismo: el envío físico lleva días."],
      concepts: [{t:"Snowcone",d:"El más pequeño y portátil; hasta 8 TB."},{t:"Snowball Edge",d:"Decenas de TB, con capacidad de cómputo para procesar en el borde."},{t:"Cifrado",d:"Los datos viajan cifrados con claves de KMS."},{t:"Cuándo conviene",d:"Regla práctica: si por red tarda semanas o meses, usá Snow."}] },
    { name: "DMS", d: "Migra bases de datos a AWS con mínimo downtime.", link: "https://aws.amazon.com/dms/",
      long: "<strong>Database Migration Service</strong> mueve bases de datos hacia AWS manteniendo la <strong>base de origen operativa durante la migración</strong>: primero copia los datos existentes y después replica los cambios en curso, de modo que el corte final dura minutos. Soporta migraciones <strong>homogéneas</strong> (Oracle a Oracle) y <strong>heterogéneas</strong> (Oracle a PostgreSQL); en el segundo caso se combina con la <strong>Schema Conversion Tool</strong>, que traduce esquemas y procedimientos almacenados.",
      use: ["Migrar una base on-premise a RDS o Aurora sin parar el negocio.", "Cambiar de motor comercial (Oracle, SQL Server) a uno open source.", "Replicación continua entre dos bases para mantenerlas sincronizadas.", "Consolidar varias bases en una sola durante una migración."],
      avoid: ["Migrar archivos o sistemas de archivos &rarr; <strong>DataSync</strong>.", "Volúmenes enormes sin buena conectividad &rarr; combinarlo con <strong>Snow Family</strong>.", "Copiar una base chica de una sola vez: un dump y restore puede ser más simple.", "Migrar la aplicación completa: DMS mueve datos, no servidores."],
      concepts: [{t:"Instancia de replicación",d:"El servidor que ejecuta la migración."},{t:"CDC",d:"Change Data Capture: replica los cambios en vivo tras la carga inicial."},{t:"Homogénea vs heterogénea",d:"Mismo motor, o cambio de motor con conversión de esquema."},{t:"SCT",d:"Schema Conversion Tool: traduce esquemas y procedimientos entre motores."}] },
    { name: "DataSync", d: "Transferencia automatizada de archivos hacia y desde AWS.", link: "https://aws.amazon.com/datasync/",
      long: "Automatiza y acelera la <strong>transferencia de archivos</strong> entre almacenamiento on-premise (NFS, SMB, HDFS) y servicios de AWS como <strong>S3, EFS y FSx</strong>, o entre servicios de AWS entre sí. Usa un protocolo propio que aprovecha mucho mejor el ancho de banda que una copia común, y se encarga del <strong>cifrado, la validación de integridad y los reintentos</strong>. A diferencia de Snow Family viaja <strong>por red</strong>, y a diferencia de Storage Gateway es una transferencia y no un acceso híbrido permanente.",
      use: ["Migrar un NAS on-premise a EFS o FSx.", "Sincronización periódica de archivos entre el datacenter y S3.", "Copiar datos entre regiones o entre cuentas de AWS.", "Enviar backups locales a S3 de forma programada."],
      avoid: ["Petabytes con red insuficiente &rarr; <strong>Snow Family</strong>.", "Acceso híbrido permanente donde los servidores locales leen y escriben en AWS &rarr; <strong>Storage Gateway</strong>.", "Migrar bases de datos &rarr; <strong>DMS</strong>.", "Copia única y pequeña: el CLI de AWS alcanza."],
      concepts: [{t:"Agente",d:"Máquina virtual que se instala on-premise para leer el origen."},{t:"Task",d:"Definición de origen, destino y programación de la transferencia."},{t:"Validación de integridad",d:"Verifica que lo transferido coincide con el origen."},{t:"vs Storage Gateway",d:"DataSync transfiere y termina; Storage Gateway deja un acceso permanente."}] },
  ]},
  { cat: "Bases de datos", accent: "#B98EF2", items: [
    { name: "RDS", d: "Bases relacionales administradas: MySQL, Postgres, MariaDB, SQL Server, Oracle.", link: "https://aws.amazon.com/rds/",
      long: "Bases de datos <strong>relacionales administradas</strong>: vos elegís el motor (MySQL, PostgreSQL, MariaDB, Oracle, SQL Server) y AWS se ocupa de instalar, parchear, respaldar y replicar. Seguís hablando SQL igual que siempre y tu ORM no se entera del cambio; lo que desaparece es el trabajo de administrar el servidor. Es la opción por defecto para cargas <strong>OLTP</strong>: muchas transacciones chicas, datos normalizados con relaciones entre tablas.",
      use: ["Backend de una app web o API con datos relacionales (usuarios, pedidos, facturas).", "Migrar una base MySQL o Postgres on-premise sin reescribir la aplicación.", "Necesitás transacciones ACID, JOINs y constraints de integridad.", "Querés backups automáticos y réplicas de lectura sin scriptearlos vos."],
      avoid: ["Consultas analíticas sobre millones de filas (OLAP) &rarr; <strong>Redshift</strong>.", "Escala masiva con acceso por clave y esquema flexible &rarr; <strong>DynamoDB</strong>.", "Querés el mismo SQL pero con más rendimiento y failover más rápido &rarr; <strong>Aurora</strong>.", "Necesitás control total del sistema operativo de la base &rarr; instalar el motor sobre <strong>EC2</strong>."],
      concepts: [{t:"Instancia de BD",d:"El servidor administrado donde corre el motor; se elige clase de instancia (CPU/RAM)."},{t:"Multi-AZ",d:"Réplica sincrónica en otra Availability Zone que toma el control sola si falla la principal. Es alta disponibilidad, no escala lecturas."},{t:"Read replica",d:"Copia asincrónica para repartir consultas de lectura. Escala lecturas, no es failover automático."},{t:"Automated backups",d:"Respaldos diarios más logs de transacción: permiten restaurar a un punto exacto en el tiempo."},{t:"Parameter group",d:"Conjunto de parámetros de configuración del motor, editable sin tocar el sistema operativo."}] },
    { name: "Aurora", d: "Motor relacional compatible MySQL/Postgres, más rápido que RDS estándar.", link: "https://aws.amazon.com/rds/aurora/",
      long: "Motor relacional propio de AWS, <strong>compatible con MySQL y PostgreSQL</strong>: el mismo código, herramientas y aplicaciones funcionan sin cambios. Entrega hasta <strong>6x el throughput</strong> de MySQL o PostgreSQL estándar sobre hardware similar, gracias a un subsistema de almacenamiento distribuido que replica los datos entre varias Availability Zones y <strong>crece solo</strong> hasta 256 TiB. Forma parte de RDS, así que hereda backups, parches y monitoreo administrados.",
      use: ["Una app que ya usa MySQL o PostgreSQL y necesita más rendimiento sin reescribirse.", "Cargas donde el failover tiene que ser rápido (segundos, no minutos).", "El volumen de datos crece de forma impredecible y no querés dimensionar discos a mano.", "Aurora Serverless v2 cuando el tráfico es intermitente y no querés pagar capacidad ociosa."],
      avoid: ["Necesitás Oracle o SQL Server: Aurora solo habla MySQL y PostgreSQL &rarr; <strong>RDS</strong>.", "Analítica sobre grandes volúmenes &rarr; <strong>Redshift</strong>.", "Presupuesto ajustado en cargas chicas: RDS estándar suele salir más barato.", "Datos sin esquema relacional y escala por clave &rarr; <strong>DynamoDB</strong>."],
      concepts: [{t:"Cluster volume",d:"El almacenamiento compartido que replica en varias AZ y crece solo hasta 256 TiB."},{t:"Writer / Reader",d:"Una instancia acepta escrituras; las réplicas de lectura comparten el mismo volumen."},{t:"Endpoint de cluster",d:"DNS que apunta siempre al writer actual; en un failover no hay que cambiar nada en la app."},{t:"Aurora Serverless v2",d:"Escala la capacidad de cómputo automáticamente según la carga."}] },
    { name: "DynamoDB", d: "NoSQL serverless con latencia de milisegundos a cualquier escala.", link: "https://aws.amazon.com/dynamodb/",
      long: "Base <strong>NoSQL serverless</strong> y distribuida, con latencia de <strong>milisegundos de un dígito a cualquier escala</strong>. No aprovisionás servidores, no hay versiones ni ventanas de mantenimiento. En modo <strong>on-demand</strong> escala sola con el tráfico y baja hasta cero: si la tabla no recibe requests, no pagás throughput. Los datos se guardan como items con atributos, sin esquema fijo más allá de la clave.",
      use: ["Carritos de compra, sesiones, perfiles de usuario: acceso por clave, altísimo volumen.", "Backend serverless junto con Lambda y API Gateway.", "Tráfico con picos impredecibles donde aprovisionar servidores no cierra.", "IoT o telemetría: escrituras masivas con lecturas por clave conocida."],
      avoid: ["Consultas ad-hoc con JOINs o filtros arbitrarios &rarr; <strong>RDS</strong> o <strong>Aurora</strong>.", "Reportes analíticos que recorren toda la tabla &rarr; <strong>Redshift</strong> o <strong>Athena</strong>.", "Modelás los datos sin saber de antemano los patrones de acceso: en DynamoDB el diseño arranca por las consultas.", "Necesitás transacciones complejas entre muchas entidades relacionadas."],
      concepts: [{t:"Partition key",d:"Determina en qué partición vive el item. Elegirla mal genera puntos calientes."},{t:"Sort key",d:"Segunda parte de la clave; permite rangos y ordenamiento dentro de una partición."},{t:"On-demand vs Provisioned",d:"On-demand cobra por request y escala solo; provisioned reserva capacidad y sale más barato con tráfico estable."},{t:"GSI",d:"Índice secundario global: habilita consultar por un atributo que no es la clave principal."},{t:"DynamoDB Streams",d:"Registro de cambios de la tabla; suele disparar una Lambda ante cada modificación."}] },
    { name: "Neptune", d: "Base de datos de grafos administrada.", link: "https://aws.amazon.com/neptune/",
      long: "Base de datos de <strong>grafos</strong> administrada: en vez de filas y tablas, guarda <strong>nodos y relaciones</strong> como ciudadanos de primera clase. Está optimizada para consultas que recorren muchos saltos — \"amigos de amigos que también compraron X\" — que en SQL exigirían JOINs anidados carísimos. Soporta los lenguajes de consulta Gremlin, openCypher y SPARQL.",
      use: ["Redes sociales: conexiones entre personas, recomendaciones por cercanía.", "Motores de recomendación basados en relaciones entre productos y usuarios.", "Detección de fraude: encontrar patrones de vínculos sospechosos entre cuentas.", "Grafos de conocimiento y catálogos con jerarquías profundas."],
      avoid: ["Los datos son tabulares y las consultas simples &rarr; <strong>RDS</strong>, mucho más barato.", "Acceso por clave a alta escala &rarr; <strong>DynamoDB</strong>.", "Analítica agregada sobre columnas &rarr; <strong>Redshift</strong>.", "Tu equipo no conoce Gremlin ni Cypher: la curva de aprendizaje es real."],
      concepts: [{t:"Nodo / Vértice",d:"La entidad del grafo: una persona, un producto, una cuenta."},{t:"Arista",d:"La relación entre dos nodos, con dirección y propiedades propias."},{t:"Gremlin / openCypher",d:"Lenguajes para recorrer el grafo, equivalentes a lo que SQL es para lo relacional."}] },
    { name: "Redshift", d: "Data warehouse administrado para analítica (OLAP).", link: "https://aws.amazon.com/redshift/",
      long: "<strong>Data warehouse</strong> administrado a escala de petabytes. Guarda los datos por <strong>columnas</strong> en vez de por filas, lo que hace que agregar millones de registros (sumas, promedios, agrupaciones) sea órdenes de magnitud más rápido que en una base transaccional. Es la pieza <strong>OLAP</strong> frente al OLTP de RDS: pocas consultas, pero enormes. En modo <strong>Serverless</strong> aprovisiona capacidad sola y no cobra mientras está ocioso.",
      use: ["Reportes de business intelligence y dashboards sobre históricos grandes.", "Consolidar datos de varias fuentes para analizarlos con SQL conocido.", "Consultar un data lake de S3 sin moverlo, vía Redshift Spectrum.", "Alimentar herramientas de BI como QuickSight, Tableau o Power BI."],
      avoid: ["Lecturas y escrituras transaccionales de la app &rarr; <strong>RDS</strong> o <strong>Aurora</strong>. Redshift no es para OLTP.", "Consultas puntuales sobre archivos en S3, sin infraestructura fija &rarr; <strong>Athena</strong>.", "Necesitás respuesta en milisegundos por clave &rarr; <strong>DynamoDB</strong>.", "El volumen de datos es chico: un Postgres alcanza y cuesta mucho menos."],
      concepts: [{t:"Almacenamiento columnar",d:"Guarda cada columna junta; lee solo las que la consulta necesita."},{t:"OLAP vs OLTP",d:"OLAP (Redshift) analiza grandes volúmenes; OLTP (RDS) procesa transacciones del día a día."},{t:"Redshift Serverless",d:"Aprovisiona y escala solo; no cobra cuando está ocioso."},{t:"Spectrum",d:"Consulta archivos en S3 directamente, sin cargarlos al warehouse."},{t:"Distribution key",d:"Define cómo se reparten las filas entre nodos; clave para el rendimiento de los JOINs."}] },
    { name: "ElastiCache", d: "Cache en memoria administrado (Redis/Memcached).", link: "https://aws.amazon.com/elasticache/",
      long: "<strong>Caché en memoria</strong> administrado, compatible con <strong>Redis</strong> y <strong>Memcached</strong>. Guarda en RAM los resultados que son caros de calcular o de traer de la base, y los devuelve en <strong>microsegundos</strong>. Su función típica es sentarse delante de RDS o DynamoDB para absorber las lecturas repetidas y bajarles la carga. Redis además sirve como store de sesiones, ranking en tiempo real, colas y pub/sub.",
      use: ["Cachear consultas caras que se repiten mucho (home de un sitio, catálogos).", "Guardar sesiones de usuario compartidas entre varias instancias de la app.", "Leaderboards, contadores y rate limiting en tiempo real (Redis).", "Bajar costo y latencia de una base que recibe la misma consulta miles de veces."],
      avoid: ["Es tu única fuente de datos: el caché es volátil y puede perder contenido &rarr; siempre detrás de <strong>RDS</strong> o <strong>DynamoDB</strong>.", "Los datos casi nunca se releen: el caché no aporta nada.", "Solo necesitás acelerar DynamoDB &rarr; <strong>DAX</strong>, que es específico para eso.", "Necesitás persistencia garantizada y durabilidad transaccional."],
      concepts: [{t:"Redis vs Memcached",d:"Redis tiene estructuras de datos, persistencia y réplicas; Memcached es más simple, solo clave-valor multihilo."},{t:"TTL",d:"Tiempo de vida de cada entrada; al vencer se descarta sola."},{t:"Cache hit / miss",d:"Hit: el dato estaba en memoria. Miss: hay que ir a la base y recién ahí guardarlo."},{t:"Lazy loading vs write-through",d:"Cargar al primer miss, o escribir al caché en cada actualización de la base."}] },
  ]},
  { cat: "Redes y CDN", accent: "#5B9EFF", items: [
    { name: "VPC", d: "Red virtual privada y aislada donde viven tus recursos.", link: "https://aws.amazon.com/vpc/",
      long: "Tu <strong>red virtual aislada</strong> dentro de AWS: se parece mucho a la red que operarías en tu propio datacenter, pero sobre infraestructura de AWS. Dentro de la VPC definís <strong>subnets</strong> (rangos de IP, cada una en una sola Availability Zone), <strong>route tables</strong> que deciden a dónde va el tráfico, y <strong>gateways</strong> que la conectan con el exterior. Es la base sobre la que se apoya casi todo: EC2, RDS y ELB viven adentro de una VPC.",
      use: ["Separar recursos públicos (servidores web) de privados (bases de datos) en subnets distintas.", "Aislar ambientes: una VPC para producción y otra para desarrollo.", "Conectar con tu datacenter por VPN o Direct Connect y tratarlo como una extensión de la red.", "Controlar exactamente qué puede hablar con qué mediante security groups y ACLs."],
      avoid: ["Servicios totalmente administrados que no necesitan red propia (S3, DynamoDB) se acceden por su API pública o por VPC endpoint.", "Para una demo mínima con una sola EC2, la VPC por defecto ya alcanza.", "No es un firewall de aplicación: para filtrar ataques HTTP &rarr; <strong>WAF</strong>."],
      concepts: [{t:"Subnet",d:"Rango de IPs dentro de la VPC. Vive en UNA sola Availability Zone."},{t:"Subnet pública vs privada",d:"Pública: su route table apunta a un internet gateway. Privada: no tiene salida directa a internet."},{t:"Internet Gateway (IGW)",d:"Puerta de entrada y salida a internet para las subnets públicas."},{t:"NAT Gateway",d:"Deja que las subnets privadas salgan a internet sin ser alcanzables desde afuera."},{t:"Security group",d:"Firewall a nivel de instancia, con estado: si permitís la entrada, la respuesta sale sola."},{t:"VPC endpoint",d:"Acceso privado a servicios como S3 sin pasar por internet."}] },
    { name: "Route 53", d: "DNS administrado, enrutamiento y health checks.", link: "https://aws.amazon.com/route53/",
      long: "El <strong>DNS</strong> administrado de AWS: traduce nombres de dominio a direcciones IP, registra dominios y decide a qué destino mandar cada consulta. Más allá del DNS clásico, ofrece <strong>políticas de enrutamiento</strong> (por latencia, geolocalización, peso, failover) y <strong>health checks</strong> que sacan de rotación un endpoint caído automáticamente. El nombre viene del puerto 53, el del protocolo DNS.",
      use: ["Apuntar tu dominio a un ELB, CloudFront o bucket S3.", "Failover automático a una región secundaria cuando la principal deja de responder.", "Mandar a cada usuario a la región más cercana por latencia o geolocalización.", "Repartir tráfico entre dos versiones de una app para un despliegue gradual."],
      avoid: ["Distribuir contenido con baja latencia &rarr; eso lo hace <strong>CloudFront</strong>; Route 53 solo resuelve nombres.", "Balancear carga entre instancias dentro de una región &rarr; <strong>ELB</strong>.", "Tu dominio ya está en otro registrador y no querés migrarlo: alcanza con delegar los nameservers."],
      concepts: [{t:"Hosted zone",d:"Contenedor de los registros DNS de un dominio."},{t:"Registro A / CNAME",d:"A apunta a una IP; CNAME apunta a otro nombre."},{t:"Alias record",d:"Registro propio de AWS que apunta a un recurso (ELB, CloudFront, S3) sin costo de consulta y sirve en la raíz del dominio."},{t:"Routing policy",d:"Simple, ponderada, por latencia, geolocalización o failover."},{t:"Health check",d:"Sondeo periódico; si el destino falla, deja de resolverse hacia él."}] },
    { name: "CloudFront", d: "CDN global de AWS para entregar contenido con baja latencia.", link: "https://aws.amazon.com/cloudfront/",
      long: "La <strong>red de distribución de contenido (CDN)</strong> de AWS: copia tu contenido en cientos de <strong>edge locations</strong> repartidas por el mundo, de modo que cada usuario lo recibe desde el punto más cercano en vez de ir hasta tu servidor de origen. Baja la latencia, reduce la carga del origen y absorbe picos de tráfico. Además termina el TLS en el borde y se integra con <strong>WAF</strong> y <strong>Shield</strong> para filtrar ataques antes de que lleguen a tu infraestructura.",
      use: ["Servir un sitio estático alojado en S3 con dominio propio y HTTPS.", "Acelerar imágenes, videos y assets de una app con usuarios en varios países.", "Poner una capa de caché y protección delante de un ELB o una API.", "Descargar del origen el tráfico repetido de archivos grandes."],
      avoid: ["Todos tus usuarios están en una sola región cerca del origen: el beneficio es marginal.", "Contenido único por usuario que nunca se puede cachear.", "Necesitás resolver nombres de dominio &rarr; <strong>Route 53</strong>.", "Balanceo entre instancias dentro de una región &rarr; <strong>ELB</strong>."],
      concepts: [{t:"Edge location",d:"Punto de presencia donde se cachea el contenido, cerca del usuario final."},{t:"Origin",d:"La fuente real del contenido: un bucket S3, un ELB o un servidor propio."},{t:"TTL / invalidación",d:"Cuánto vive una copia en caché; la invalidación la borra antes de tiempo."},{t:"OAC",d:"Origin Access Control: deja que solo CloudFront lea el bucket S3, cerrándolo al público."},{t:"Cache behavior",d:"Reglas por patrón de ruta: qué cachear, por cuánto y con qué headers."}] },
    { name: "API Gateway", d: "Publicá y asegurá APIs REST, HTTP y WebSocket.", link: "https://aws.amazon.com/api-gateway/",
      long: "<strong>Puerta de entrada administrada</strong> para tus APIs: recibe las peticiones HTTP y las enruta a Lambda, a un servicio en ECS, a un ELB o a cualquier endpoint. Se ocupa de lo que rodea a la API sin que lo programes: <strong>autenticación</strong> (con Cognito o IAM), <strong>rate limiting</strong>, versionado por stages, validación de requests, CORS y logging. Soporta APIs REST, HTTP (más simples y baratas) y WebSocket para conexiones persistentes.",
      use: ["Exponer funciones Lambda como una API HTTP pública: el patrón serverless clásico.", "Poner autenticación y límite de tasa delante de un backend que no los implementa.", "Manejar varios ambientes (dev, staging, prod) con stages de la misma API.", "APIs WebSocket para chat o notificaciones en tiempo real."],
      avoid: ["Servir archivos estáticos &rarr; <strong>S3</strong> más <strong>CloudFront</strong>.", "Tráfico altísimo y constante: el costo por millón de requests puede superar al de un <strong>ELB</strong> con contenedores.", "Comunicación interna entre microservicios: suele alcanzar un load balancer interno.", "Necesitás conexiones de muy baja latencia y protocolo propio &rarr; <strong>NLB</strong>."],
      concepts: [{t:"Stage",d:"Versión desplegada de la API (dev, prod), cada una con su URL."},{t:"Resource / Method",d:"La ruta (/usuarios) y el verbo HTTP (GET, POST) que la API expone."},{t:"Authorizer",d:"Valida el token de cada request; puede ser Cognito, IAM o una Lambda propia."},{t:"Usage plan / API key",d:"Cuotas y límite de tasa por cliente."},{t:"REST vs HTTP API",d:"HTTP API es más simple, rápida y barata; REST API tiene más funcionalidades."}] },
    { name: "ELB", d: "Balanceador de carga elástico entre instancias/targets.", link: "https://aws.amazon.com/elasticloadbalancing/",
      long: "<strong>Elastic Load Balancing</strong> reparte automáticamente el tráfico entrante entre varios destinos — instancias EC2, contenedores, direcciones IP o funciones Lambda — en una o más Availability Zones. Monitorea la salud de cada destino con <strong>health checks</strong> y solo manda tráfico a los que responden bien, y <strong>escala su propia capacidad</strong> según la demanda. También puede terminar el TLS, liberando a los servidores del costo de cifrar.",
      use: ["Repartir tráfico entre varias EC2 en distintas AZ para tolerar la caída de una.", "Enrutar por ruta o por dominio hacia distintos servicios (ALB).", "Sacar de rotación automáticamente una instancia que dejó de responder.", "Terminar HTTPS en el balanceador y hablar HTTP puertas adentro."],
      avoid: ["Un solo servidor sin necesidad de alta disponibilidad: es costo sin beneficio.", "Distribuir contenido estático globalmente &rarr; <strong>CloudFront</strong>.", "Resolver nombres de dominio o hacer failover entre regiones &rarr; <strong>Route 53</strong>.", "Backend serverless con Lambda &rarr; <strong>API Gateway</strong> suele encajar mejor."],
      concepts: [{t:"ALB",d:"Application Load Balancer: capa 7 (HTTP/HTTPS), enruta por ruta, host o header."},{t:"NLB",d:"Network Load Balancer: capa 4 (TCP/UDP), latencia ultrabaja y millones de conexiones."},{t:"Target group",d:"Conjunto de destinos que reciben el tráfico, con su health check propio."},{t:"Health check",d:"Sondeo periódico; el destino que falla queda fuera de rotación."},{t:"Cross-zone balancing",d:"Reparte parejo entre todas las AZ, sin importar cuántos destinos tenga cada una."}] },
    { name: "Direct Connect", d: "Conexión de red dedicada y privada entre tu datacenter y AWS.", link: "https://aws.amazon.com/directconnect/",
      long: "Un <strong>enlace físico dedicado</strong> entre tu datacenter u oficina y AWS, que no pasa por internet. Al ser una conexión propia y no compartida, entrega <strong>ancho de banda constante y latencia predecible</strong>, algo que una VPN sobre internet no puede garantizar. Además abarata la transferencia de salida cuando movés grandes volúmenes de forma sostenida. Se contrata a través de un partner en una ubicación de Direct Connect.",
      use: ["Arquitecturas híbridas que mueven mucho tráfico entre on-premise y AWS todos los días.", "Cargas sensibles a la latencia donde la variabilidad de internet no es aceptable.", "Requisitos regulatorios que exigen que el tráfico no viaje por internet público.", "Migraciones grandes con transferencia sostenida durante semanas o meses."],
      avoid: ["Necesitás conectividad ya mismo: instalar un enlace físico lleva semanas &rarr; <strong>Site-to-Site VPN</strong>.", "El volumen de tráfico es bajo: el costo fijo mensual no se justifica.", "No tenés infraestructura on-premise que conectar.", "Mover datos una sola vez &rarr; <strong>Snowball</strong> o DataSync."],
      concepts: [{t:"Ubicación de Direct Connect",d:"Datacenter físico donde tu red se interconecta con la de AWS."},{t:"Virtual Interface (VIF)",d:"Interfaz lógica sobre el enlace: privada hacia tu VPC, pública hacia servicios de AWS."},{t:"VPN como respaldo",d:"Práctica habitual: una VPN por internet queda de reserva si el enlace se cae."}] },
  ]},
  { cat: "Seguridad e identidad", accent: "#FF6B6B", items: [
    { name: "IAM", d: "Usuarios, grupos, roles y permisos de acceso a recursos.", link: "https://aws.amazon.com/iam/",
      long: "Controla <strong>quién puede hacer qué</strong> sobre cada recurso de AWS. Separa dos cosas: la <strong>autenticación</strong> (quién sos) y la <strong>autorización</strong> (qué te dejan hacer). Al crear la cuenta empezás con el <strong>root user</strong>, que puede todo — AWS recomienda fuertemente no usarlo en el día a día y crear identidades específicas. La pieza más importante son los <strong>roles</strong>: permisos temporales que asume un servicio o una persona, sin claves permanentes dando vueltas. IAM no cuesta nada.",
      use: ["Dar a cada persona del equipo solo los permisos que su tarea necesita.", "Permitir que una EC2 o una Lambda accedan a S3 sin credenciales embebidas en el código.", "Federar el login con el proveedor de identidad de la empresa.", "Auditar qué identidad tiene acceso a qué recurso."],
      avoid: ["Autenticar a los usuarios finales de tu aplicación &rarr; <strong>Cognito</strong>. IAM es para acceso a AWS, no para el login de tu app.", "Guardar contraseñas de bases de datos o claves de API &rarr; <strong>Secrets Manager</strong>.", "Gobernar varias cuentas a la vez &rarr; <strong>Organizations</strong> con SCPs.", "Usar el root user para tareas cotidianas: es la mala práctica número uno."],
      concepts: [{t:"Usuario / Grupo",d:"Identidad permanente de una persona; el grupo junta usuarios con los mismos permisos."},{t:"Rol",d:"Identidad temporal que asume un servicio o persona. La forma correcta de dar permisos a EC2 o Lambda."},{t:"Policy",d:"Documento JSON que enumera acciones permitidas o denegadas sobre qué recursos."},{t:"Principio de menor privilegio",d:"Otorgar solo los permisos estrictamente necesarios."},{t:"MFA",d:"Segundo factor de autenticación; obligatorio de hecho para el root user."},{t:"Deny explícito",d:"Un Deny siempre gana sobre cualquier Allow."}] },
    { name: "KMS", d: "Creación y gestión de claves de cifrado.", link: "https://aws.amazon.com/kms/",
      long: "<strong>Key Management Service</strong>: crea, guarda y controla las <strong>claves de cifrado</strong> que usan los demás servicios. Las claves maestras nunca salen del servicio en texto plano y están respaldadas por módulos de hardware (HSM). Casi todo AWS se integra con KMS: activar el cifrado en un bucket S3, un volumen EBS o una base RDS es marcar una casilla y elegir la clave. Cada uso de la clave queda registrado en <strong>CloudTrail</strong>, lo que da trazabilidad completa de quién descifró qué y cuándo.",
      use: ["Cifrar en reposo S3, EBS, RDS, DynamoDB con claves bajo tu control.", "Cumplir requisitos regulatorios que exigen gestión propia de claves.", "Auditar cada operación de cifrado y descifrado vía CloudTrail.", "Rotar claves automáticamente una vez al año, sin tocar las aplicaciones."],
      avoid: ["Guardar contraseñas o tokens: KMS gestiona claves, no secretos &rarr; <strong>Secrets Manager</strong>.", "Cifrar volúmenes grandes de datos directamente: KMS cifra hasta 4 KB por llamada; para más se usa una clave de datos.", "El cifrado por defecto de AWS ya te alcanza y no necesitás control propio de la clave.", "Necesitás un HSM dedicado de un solo inquilino &rarr; CloudHSM."],
      concepts: [{t:"KMS key (CMK)",d:"La clave maestra. Nunca sale de KMS en texto plano."},{t:"AWS managed vs Customer managed",d:"Las administradas por AWS son gratis y automáticas; las tuyas dan control de política y rotación."},{t:"Envelope encryption",d:"KMS cifra una clave de datos, y esa clave cifra el archivo. Así se cifran objetos grandes."},{t:"Key policy",d:"Política que define quién puede usar y administrar la clave."},{t:"Rotación automática",d:"Genera material criptográfico nuevo cada año de forma transparente."}] },
    { name: "Cognito", d: "Autenticación, autorización y gestión de usuarios de tus apps.", link: "https://aws.amazon.com/cognito/",
      long: "Maneja el <strong>login de los usuarios finales</strong> de tu aplicación web o móvil: registro, confirmación por mail, contraseñas, MFA, recuperación de cuenta y <strong>login social</strong> con Google, Facebook o Apple. Tiene dos piezas distintas que conviene no confundir: el <strong>User Pool</strong> es el directorio de usuarios que emite tokens JWT, y el <strong>Identity Pool</strong> canjea esos tokens por credenciales temporales de AWS para que el front acceda directo a S3 o DynamoDB.",
      use: ["Login y registro de una app web o móvil sin construir la autenticación desde cero.", "Ofrecer inicio de sesión con Google o Apple sin implementar OAuth a mano.", "Proteger una API detrás de API Gateway validando el token de Cognito.", "Dar a una app móvil acceso temporal y acotado a recursos de AWS."],
      avoid: ["Controlar el acceso del equipo a la consola de AWS &rarr; <strong>IAM</strong>.", "Necesitás personalizar cada detalle del flujo de autenticación: Cognito es opinado y a veces incómodo.", "Ya usás Auth0, Firebase Auth o Keycloak y funcionan bien.", "Autenticación entre servicios (machine to machine) sin usuarios humanos: suele bastar IAM."],
      concepts: [{t:"User Pool",d:"Directorio de usuarios de tu app. Emite tokens JWT tras el login."},{t:"Identity Pool",d:"Canjea un token por credenciales temporales de AWS."},{t:"Federación",d:"Login con proveedores externos: Google, Apple, SAML corporativo."},{t:"Hosted UI",d:"Pantalla de login lista para usar, personalizable con tu marca."},{t:"JWT",d:"Token firmado que el backend valida sin consultar a Cognito en cada request."}] },
    { name: "Shield", d: "Protección administrada contra DDoS.", link: "https://aws.amazon.com/shield/",
      long: "Protección administrada contra ataques de <strong>denegación de servicio distribuida (DDoS)</strong>. <strong>Shield Standard</strong> viene activado y es <strong>gratuito para todas las cuentas</strong>: mitiga automáticamente los ataques más comunes de capa de red y transporte sobre CloudFront, Route 53 y ELB. <strong>Shield Advanced</strong> es un servicio pago que suma detección de ataques a nivel de aplicación, acceso a un equipo de respuesta de AWS y <strong>protección económica</strong>: si un ataque te dispara la factura por escalado, AWS te reembolsa la diferencia.",
      use: ["Ya lo estás usando: Standard está activo por defecto y no hay que configurar nada.", "Advanced para aplicaciones críticas con exposición pública y alto riesgo.", "Cuando necesitás la garantía de que un ataque no te va a inflar la factura.", "Acceso al equipo de respuesta de AWS durante un incidente en curso."],
      avoid: ["Filtrar peticiones HTTP maliciosas por contenido (SQL injection, bots) &rarr; <strong>WAF</strong>. Shield para inundaciones, WAF para contenido.", "Advanced tiene un costo mensual alto: para proyectos chicos, Standard alcanza.", "No reemplaza los security groups ni el diseño de red de tu VPC."],
      concepts: [{t:"Shield Standard",d:"Gratis y siempre activo. Mitiga ataques de capa 3 y 4."},{t:"Shield Advanced",d:"Pago. Suma capa 7, métricas detalladas y equipo de respuesta."},{t:"Cost protection",d:"Reembolso de los cargos por escalado provocados por un ataque."},{t:"Capa 3/4 vs 7",d:"Red y transporte (inundaciones de paquetes) frente a aplicación (peticiones HTTP)."}] },
    { name: "WAF", d: "Firewall de aplicaciones web, filtra tráfico malicioso HTTP.", link: "https://aws.amazon.com/waf/",
      long: "<strong>Firewall de aplicaciones web</strong>: inspecciona cada petición HTTP y decide si permitirla, bloquearla o contarla, según reglas que mirán la IP de origen, el país, los headers, el cuerpo o la URI. Se coloca delante de <strong>CloudFront, ALB o API Gateway</strong>. Trae <strong>managed rule groups</strong> mantenidos por AWS que cubren de entrada el OWASP Top 10, bots conocidos y direcciones con mala reputación, así que no arrancás de cero.",
      use: ["Bloquear intentos de SQL injection y cross-site scripting contra tu app.", "Limitar la tasa de peticiones por IP para frenar fuerza bruta o scraping.", "Bloquear o permitir tráfico por país cuando el negocio es regional.", "Filtrar bots automatizados que consumen recursos de la API."],
      avoid: ["Inundaciones volumétricas de red &rarr; <strong>Shield</strong>; WAF trabaja sobre HTTP.", "Controlar tráfico entre instancias dentro de la VPC &rarr; security groups.", "Tu servicio no está expuesto a internet: no hay superficie que proteger.", "Esperar que reemplace un código seguro: es una capa más, no la única."],
      concepts: [{t:"Web ACL",d:"El conjunto de reglas que se asocia a CloudFront, ALB o API Gateway."},{t:"Rule",d:"Condición y acción: allow, block o count."},{t:"Managed rule group",d:"Reglas mantenidas por AWS o terceros para amenazas conocidas."},{t:"Rate-based rule",d:"Bloquea una IP que supera N requests en un intervalo."},{t:"Modo count",d:"Registra sin bloquear; sirve para probar una regla antes de activarla."}] },
    { name: "Secrets Manager", d: "Almacenamiento y rotación segura de credenciales.", link: "https://aws.amazon.com/secrets-manager/",
      long: "Guarda <strong>secretos</strong> —contraseñas de bases de datos, claves de API, tokens— cifrados con KMS, y los entrega a la aplicación en tiempo de ejecución mediante una llamada a la API. Su diferencial es la <strong>rotación automática</strong>: puede cambiar sola la contraseña de una base RDS cada N días y actualizar el secreto sin que la app se entere ni haya downtime. El acceso se controla con IAM y cada lectura queda registrada en CloudTrail.",
      use: ["Sacar contraseñas y claves del código, de los archivos .env y del repositorio.", "Rotar automáticamente las credenciales de RDS o Aurora.", "Compartir un secreto entre varios servicios con permisos IAM controlados.", "Auditar exactamente qué servicio leyó qué credencial y cuándo."],
      avoid: ["Configuración que no es sensible (URLs, flags, timeouts) &rarr; <strong>Parameter Store</strong>, gratis.", "Presupuesto muy ajustado: se cobra por secreto por mes; Parameter Store estándar no cuesta nada.", "Gestionar claves de cifrado en vez de secretos &rarr; <strong>KMS</strong>.", "Certificados TLS públicos &rarr; ACM, que los emite y renueva gratis."],
      concepts: [{t:"Secret",d:"Par clave-valor cifrado, versionado y con historial."},{t:"Rotación automática",d:"Una Lambda cambia la credencial periódicamente y actualiza el secreto."},{t:"Cifrado con KMS",d:"Cada secreto se cifra con una clave de KMS."},{t:"vs Parameter Store",d:"Secrets Manager rota y cuesta; Parameter Store es más simple y su nivel estándar es gratuito."}] },
    { name: "CloudHSM", d: "Módulo de hardware de seguridad dedicado y de un solo inquilino.", link: "https://aws.amazon.com/cloudhsm/",
      long: "<strong>Módulo de seguridad por hardware (HSM)</strong> dedicado: un dispositivo físico certificado <strong>FIPS 140-2 Nivel 3</strong> de uso exclusivo tuyo, dentro de tu VPC. La diferencia con KMS es el <strong>control</strong>: en CloudHSM administrás las claves vos y <strong>ni siquiera AWS puede acceder a ellas</strong>. A cambio, también sos responsable de respaldarlas: si perdés el material criptográfico, no hay forma de recuperarlo.",
      use: ["Requisitos regulatorios que exigen HSM dedicado y certificación FIPS 140-2 Nivel 3.", "Necesitás que el proveedor de nube no tenga ninguna posibilidad de acceso a las claves.", "Migrar una infraestructura de clave pública (PKI) propia a AWS.", "Operaciones criptográficas de alto volumen con hardware dedicado."],
      avoid: ["Para casi todos los casos &rarr; <strong>KMS</strong>: más barato, más simple y ya integrado con los demás servicios.", "Guardar contraseñas o tokens &rarr; <strong>Secrets Manager</strong>.", "Costo alto por hora y por HSM, más la operación a cargo tuyo.", "No hay recuperación posible si perdés las claves: el riesgo operativo es real."],
      concepts: [{t:"HSM dedicado",d:"Hardware de un solo inquilino, no compartido con otros clientes."},{t:"FIPS 140-2 Nivel 3",d:"Certificación que suele ser el motivo real para elegirlo."},{t:"vs KMS",d:"KMS es multi-inquilino y administrado; CloudHSM es tuyo y lo administrás vos."}] },
  ]},
  { cat: "Seguridad y detección", accent: "#FF8FA3", items: [
    { name: "GuardDuty", d: "Detección inteligente de amenazas en la cuenta.", link: "https://aws.amazon.com/guardduty/",
      long: "Servicio de <strong>detección de amenazas</strong> que analiza continuamente los registros que ya genera tu cuenta — <strong>CloudTrail, VPC Flow Logs y consultas DNS</strong> — buscando actividad sospechosa mediante aprendizaje automático e inteligencia de amenazas. Detecta cosas como una instancia minando criptomonedas, credenciales usándose desde un país inesperado o comunicación con servidores de comando y control conocidos. Se activa <strong>con un clic y sin instalar agentes</strong>.",
      use: ["Detección de intrusiones sin desplegar ni mantener agentes.", "Alertar cuando credenciales de IAM se usan desde ubicaciones anómalas.", "Descubrir instancias EC2 comprometidas que hacen minado o escaneo de puertos.", "Cumplimiento normativo que exige monitoreo continuo de amenazas."],
      avoid: ["Buscar vulnerabilidades en el software de tus instancias &rarr; <strong>Inspector</strong>.", "Detectar datos sensibles guardados en S3 &rarr; <strong>Macie</strong>.", "Verificar configuración contra reglas &rarr; <strong>Config</strong>.", "Detecta pero no bloquea: la respuesta al incidente la organizás vos."],
      concepts: [{t:"Finding",d:"Hallazgo con su nivel de severidad: bajo, medio o alto."},{t:"Fuentes de datos",d:"CloudTrail, VPC Flow Logs y logs de DNS; no requiere agentes."},{t:"Sin agentes",d:"Se habilita con un clic; no hay software que instalar en las instancias."},{t:"Integración",d:"Los hallazgos van a EventBridge o Security Hub para automatizar la respuesta."}] },
    { name: "Inspector", d: "Escaneo automatizado de vulnerabilidades.", link: "https://aws.amazon.com/inspector/",
      long: "Escanea de forma <strong>continua y automatizada</strong> tus instancias EC2, imágenes de contenedor en <strong>ECR</strong> y funciones <strong>Lambda</strong> buscando <strong>vulnerabilidades conocidas (CVE)</strong> y exposición de red no intencional. A diferencia de GuardDuty, que busca actividad maliciosa en curso, Inspector busca <strong>debilidades explotables</strong> antes de que alguien las use. Prioriza cada hallazgo con un puntaje de riesgo que considera si el recurso es alcanzable desde internet.",
      use: ["Detectar paquetes desactualizados con CVE conocidos en las instancias.", "Escanear imágenes Docker en ECR antes de desplegarlas a producción.", "Encontrar instancias accesibles desde internet sin que deberían serlo.", "Cumplir requisitos de gestión de vulnerabilidades."],
      avoid: ["Detectar un ataque en curso &rarr; <strong>GuardDuty</strong>.", "Datos sensibles en S3 &rarr; <strong>Macie</strong>.", "Vulnerabilidades en tu propio código: Inspector mira dependencias y sistema, no tu lógica.", "Configuración de recursos contra políticas &rarr; <strong>Config</strong>."],
      concepts: [{t:"CVE",d:"Identificador público de una vulnerabilidad conocida."},{t:"Escaneo continuo",d:"Reevalúa automáticamente cuando aparece un CVE nuevo."},{t:"Puntaje de riesgo",d:"Prioriza según gravedad y exposición real a internet."},{t:"Objetivos",d:"Instancias EC2, imágenes en ECR y funciones Lambda."}] },
    { name: "Macie", d: "Descubre y protege datos sensibles en S3.", link: "https://aws.amazon.com/macie/",
      long: "Usa aprendizaje automático para <strong>descubrir datos sensibles</strong> guardados en <strong>S3</strong>: números de tarjeta de crédito, documentos de identidad, credenciales, claves privadas y otra <strong>información personal identificable (PII)</strong>. Además evalúa la postura de seguridad de los buckets — cuáles son públicos, cuáles no están cifrados, cuáles se comparten con otras cuentas. Responde una pregunta que ninguna otra herramienta contesta: <strong>qué hay realmente adentro de tus archivos</strong>.",
      use: ["Descubrir que hay PII guardada en buckets que no deberían tenerla.", "Cumplimiento de GDPR, HIPAA o PCI que exige saber dónde viven los datos sensibles.", "Inventario de qué buckets son públicos o están sin cifrar.", "Auditoría previa a abrir el acceso a un bucket."],
      avoid: ["Solo trabaja sobre <strong>S3</strong>: no analiza RDS, DynamoDB ni discos EBS.", "Detectar amenazas activas &rarr; <strong>GuardDuty</strong>.", "Vulnerabilidades de software &rarr; <strong>Inspector</strong>.", "Se cobra por volumen de datos analizados: sobre buckets enormes puede salir caro."],
      concepts: [{t:"PII",d:"Información personal identificable: nombres, documentos, tarjetas."},{t:"Identificador de datos",d:"Patrones gestionados por AWS o definidos por vos."},{t:"Trabajo de descubrimiento",d:"Análisis programado o puntual sobre buckets seleccionados."},{t:"Postura del bucket",d:"Evalúa acceso público, cifrado y comparticiones."}] },
    { name: "Artifact", d: "Portal de descarga de informes de cumplimiento de AWS.", link: "https://aws.amazon.com/artifact/",
      long: "Portal de <strong>autoservicio</strong> desde donde descargás los <strong>informes de cumplimiento</strong> de AWS: SOC 1, SOC 2, SOC 3, ISO 27001, PCI DSS, FedRAMP y otros. Sirve para demostrarle a un auditor que la parte de la infraestructura que administra AWS está certificada. También permite revisar y aceptar acuerdos como el <strong>BAA de HIPAA</strong>. Es <strong>gratuito</strong>, y encaja directamente con el modelo de responsabilidad compartida: cubre la mitad de AWS, no la tuya.",
      use: ["Un auditor pide evidencia de las certificaciones de AWS.", "Descargar el informe SOC 2 para el área de cumplimiento de tu empresa.", "Aceptar el acuerdo BAA antes de manejar datos de salud bajo HIPAA.", "Entender qué controles cubre AWS y cuáles quedan de tu lado."],
      avoid: ["No certifica TU aplicación: solo cubre la infraestructura de AWS.", "Evaluar el cumplimiento de tus recursos &rarr; <strong>Config</strong>.", "No genera reportes propios: entrega los de AWS.", "No reemplaza tu propia auditoría ni tus controles internos."],
      concepts: [{t:"Informe SOC",d:"Auditoría independiente de los controles de AWS."},{t:"ISO 27001",d:"Norma internacional de gestión de seguridad de la información."},{t:"BAA",d:"Acuerdo requerido para procesar datos de salud bajo HIPAA."},{t:"Gratuito",d:"Disponible en la consola sin costo."}] },
    { name: "IAM Identity Center", d: "Inicio de sesión único para múltiples cuentas y aplicaciones.", link: "https://aws.amazon.com/iam/identity-center/",
      long: "Antes llamado <strong>AWS SSO</strong>: da <strong>inicio de sesión único</strong> a todas las cuentas de la organización y a aplicaciones externas desde un solo portal. Se conecta con el directorio corporativo (Active Directory, Okta, Entra ID) y asigna permisos por <strong>conjuntos de permisos</strong>, en vez de crear un usuario IAM por persona en cada cuenta. Es la <strong>práctica recomendada actual</strong> para el acceso humano: las credenciales son <strong>temporales</strong>, sin claves de larga duración dando vueltas.",
      use: ["Varias cuentas de AWS y un equipo que necesita acceder a todas.", "Integrar el login con el directorio corporativo existente.", "Eliminar usuarios IAM con credenciales permanentes.", "Dar y quitar accesos desde un solo lugar al entrar o salir alguien del equipo."],
      avoid: ["Una sola cuenta y una sola persona: <strong>IAM</strong> alcanza.", "Autenticar usuarios finales de tu aplicación &rarr; <strong>Cognito</strong>.", "Acceso programado entre servicios: para eso son los roles de IAM.", "Requiere <strong>Organizations</strong> para aprovechar el multi-cuenta."],
      concepts: [{t:"Permission set",d:"Conjunto de permisos que se asigna a un grupo sobre una cuenta."},{t:"Fuente de identidad",d:"Directorio propio del servicio, Active Directory o un proveedor externo."},{t:"Credenciales temporales",d:"Cada sesión obtiene credenciales que expiran solas."},{t:"Ex AWS SSO",d:"Cambió de nombre en 2022; ambos nombres aparecen en documentación."}] },
    { name: "Control Tower", d: "Configura y gobierna un entorno multi-cuenta seguro.", link: "https://aws.amazon.com/controltower/",
      long: "Automatiza el armado de una <strong>zona de aterrizaje (landing zone)</strong>: un entorno multi-cuenta con las buenas prácticas ya aplicadas. En pocos pasos crea la estructura de <strong>Organizations</strong>, cuentas separadas para registro y auditoría, <strong>IAM Identity Center</strong>, CloudTrail centralizado y un conjunto de <strong>controles (guardrails)</strong>. Los controles son <strong>preventivos</strong> (SCPs que impiden acciones) o <strong>de detección</strong> (reglas de Config que marcan desviaciones). Es la forma rápida de empezar bien en vez de armar todo a mano.",
      use: ["Arrancar en AWS con una estructura multi-cuenta desde el principio.", "Aplicar políticas de gobierno de forma uniforme a todas las cuentas.", "Crear cuentas nuevas ya configuradas con la base de seguridad.", "Detectar cuentas que se desviaron de la configuración esperada."],
      avoid: ["Una sola cuenta sin planes de crecer: es sobredimensionado.", "Ya tenés una organización compleja y personalizada: adoptarlo puede requerir reestructurar.", "Solo necesitás facturación consolidada &rarr; <strong>Organizations</strong> solo.", "Requerís control total del diseño: Control Tower es opinado."],
      concepts: [{t:"Landing zone",d:"Entorno multi-cuenta preconfigurado con buenas prácticas."},{t:"Guardrail",d:"Control preventivo (SCP) o de detección (regla de Config)."},{t:"Account Factory",d:"Crea cuentas nuevas ya configuradas según el estándar."},{t:"Drift",d:"Desviación de una cuenta respecto de la configuración esperada."}] },
    { name: "Personal Health Dashboard", d: "Estado de los servicios de AWS que afectan tu cuenta.", link: "https://health.aws.amazon.com/health/home",
      long: "Muestra los eventos de AWS que <strong>afectan específicamente a tus recursos</strong>, no el estado general de la nube. Avisa de mantenimientos programados de tus instancias, degradaciones que impactan las regiones donde tenés cargas, y cambios que requieren acción de tu parte — por ejemplo un certificado por vencer. La diferencia con el <strong>Service Health Dashboard</strong> (público y global) es justamente esa: está <strong>personalizado</strong> según lo que usás.",
      use: ["Enterarte de que una instancia tuya tiene mantenimiento programado.", "Saber si una interrupción en curso afecta tus recursos o no.", "Recibir alertas por EventBridge cuando aparece un evento que te toca.", "Anticipar cambios que exigen acción antes de una fecha límite."],
      avoid: ["Ver el estado global de AWS &rarr; Service Health Dashboard, público.", "Monitorear tus propias aplicaciones &rarr; <strong>CloudWatch</strong>.", "No detecta problemas de tu código: informa eventos del lado de AWS."],
      concepts: [{t:"Personal vs Service Health",d:"Personal muestra lo que te afecta a vos; Service Health es el estado público global."},{t:"Evento programado",d:"Mantenimiento o cambio con fecha anunciada sobre tus recursos."},{t:"Integración con EventBridge",d:"Permite automatizar una respuesta ante cada evento."}] },
  ]},
  { cat: "Administración", accent: "#6FE07A", items: [
    { name: "CloudWatch", d: "Métricas, logs y alarmas de tus recursos.", link: "https://aws.amazon.com/cloudwatch/",
      long: "El servicio de <strong>observabilidad</strong> de AWS: recolecta <strong>métricas</strong> (CPU, memoria, latencia, invocaciones), <strong>logs</strong> de aplicaciones y servicios, y permite definir <strong>alarmas</strong> que disparan una acción cuando un valor cruza un umbral. Casi todos los servicios publican métricas ahí sin configuración. Una alarma puede notificar por <strong>SNS</strong>, escalar un Auto Scaling Group o ejecutar una Lambda. Responde a la pregunta <strong>qué está pasando</strong> con tus recursos.",
      use: ["Alarma que avisa cuando la CPU de una EC2 pasa el 80% por varios minutos.", "Centralizar los logs de Lambda, ECS y aplicaciones en un solo lugar.", "Disparar el escalado automático de un Auto Scaling Group según la demanda.", "Dashboards con las métricas clave del sistema para el equipo."],
      avoid: ["Saber quién ejecutó una acción en la cuenta &rarr; <strong>CloudTrail</strong>. CloudWatch dice qué pasa, CloudTrail quién lo hizo.", "Verificar si un recurso cumple una política de configuración &rarr; <strong>Config</strong>.", "Trazar una request a través de varios microservicios &rarr; X-Ray.", "Retener logs por años sin filtrar: sale caro; conviene exportarlos a S3."],
      concepts: [{t:"Métrica",d:"Serie temporal de un valor numérico (CPUUtilization, Invocations)."},{t:"Alarma",d:"Umbral sobre una métrica que dispara una acción al cruzarse."},{t:"Log group / stream",d:"Los logs se agrupan por recurso y dentro por flujo de ejecución."},{t:"Métrica personalizada",d:"Valores propios que tu aplicación publica en CloudWatch."},{t:"Logs Insights",d:"Lenguaje de consulta para buscar y agregar sobre los logs."}] },
    { name: "CloudTrail", d: "Registra y audita todas las llamadas a la API.", link: "https://aws.amazon.com/cloudtrail/",
      long: "<strong>Registro de auditoría</strong> de la cuenta: guarda cada llamada a la API de AWS con <strong>quién la hizo, cuándo, desde qué IP y con qué resultado</strong>. Da igual si vino de la consola, del CLI o de un SDK: todo queda anotado. Viene activo por defecto con los últimos 90 días de historial de eventos; para conservar más tiempo se crea un <strong>trail</strong> que deposita los registros en S3. Es la herramienta de investigación forense cuando algo cambió y nadie sabe quién fue.",
      use: ["Averiguar quién borró un bucket o modificó un security group.", "Cumplir requisitos de auditoría y retención regulatoria.", "Detectar uso de credenciales desde ubicaciones inesperadas.", "Reconstruir la secuencia de eventos después de un incidente."],
      avoid: ["Monitorear el rendimiento o la salud de un recurso &rarr; <strong>CloudWatch</strong>.", "Evaluar si la configuración cumple una regla &rarr; <strong>Config</strong>.", "Ver el tráfico de red dentro de la VPC &rarr; VPC Flow Logs.", "Registrar la actividad de los usuarios de tu aplicación: CloudTrail audita AWS, no tu app."],
      concepts: [{t:"Event history",d:"Últimos 90 días de actividad, disponible sin configurar nada."},{t:"Trail",d:"Configuración que entrega los eventos a un bucket S3 para retención larga."},{t:"Management vs Data events",d:"Los de gestión (crear una instancia) vienen por defecto; los de datos (leer un objeto S3) se activan aparte y tienen costo."},{t:"Organization trail",d:"Un solo trail que cubre todas las cuentas de la organización."}] },
    { name: "Config", d: "Rastrea configuración y evalúa cumplimiento contra reglas.", link: "https://aws.amazon.com/config/",
      long: "Lleva un <strong>inventario y un historial de la configuración</strong> de cada recurso: qué existe, cómo está configurado y <strong>cómo fue cambiando en el tiempo</strong>. Sobre eso aplica <strong>reglas</strong> que evalúan cumplimiento — por ejemplo \"ningún bucket S3 debe ser público\" o \"todos los volúmenes EBS deben estar cifrados\" — y marca los recursos que no cumplen. Algunas reglas incluyen <strong>remediación automática</strong>: corrigen la desviación solas. Responde <strong>cómo está configurado</strong> y <strong>cumple o no</strong>.",
      use: ["Detectar buckets S3 que quedaron públicos por error.", "Verificar continuamente que todos los discos estén cifrados.", "Ver el historial de configuración de un recurso para entender cuándo se rompió algo.", "Demostrar cumplimiento normativo con evidencia automática."],
      avoid: ["Saber quién hizo el cambio &rarr; <strong>CloudTrail</strong>.", "Monitorear métricas de rendimiento &rarr; <strong>CloudWatch</strong>.", "Cuentas chicas con pocos recursos: se cobra por ítem de configuración registrado.", "Impedir que una acción ocurra &rarr; <strong>SCPs</strong> de Organizations o políticas de IAM; Config detecta, no bloquea."],
      concepts: [{t:"Configuration item",d:"Foto del estado de un recurso en un momento dado."},{t:"Rule",d:"Condición de cumplimiento, gestionada por AWS o definida con una Lambda."},{t:"Conformance pack",d:"Conjunto de reglas empaquetadas para un estándar (PCI, HIPAA)."},{t:"Remediación",d:"Acción automática que corrige un recurso no conforme."}] },
    { name: "Trusted Advisor", d: "Recomendaciones de costo, seguridad, performance y límites.", link: "https://aws.amazon.com/premiumsupport/trustedadvisor/",
      long: "Inspecciona tu cuenta y devuelve <strong>recomendaciones concretas</strong> en cinco categorías: <strong>optimización de costos, seguridad, tolerancia a fallos, rendimiento y límites de servicio</strong>. Detecta cosas como instancias EC2 subutilizadas, buckets con permisos abiertos, ausencia de MFA en el root user o cuotas cerca del tope. Con los planes <strong>Basic y Developer</strong> solo ves un subconjunto de verificaciones; el <strong>set completo requiere Business o Enterprise</strong> — dato que suele aparecer en el examen.",
      use: ["Revisión periódica de la cuenta buscando ahorros rápidos.", "Detectar configuraciones inseguras evidentes antes de que se conviertan en incidente.", "Anticipar que un servicio está por chocar contra su cuota.", "Identificar recursos aprovisionados y sin uso que siguen facturando."],
      avoid: ["Es un chequeo periódico, no monitoreo en vivo &rarr; <strong>CloudWatch</strong>.", "Auditoría detallada de configuración con historial &rarr; <strong>Config</strong>.", "Análisis fino de costos por etiqueta o servicio &rarr; <strong>Cost Explorer</strong>.", "Sin plan Business o Enterprise, las verificaciones disponibles son limitadas."],
      concepts: [{t:"5 categorías",d:"Costos, seguridad, tolerancia a fallos, rendimiento y límites de servicio."},{t:"Dependencia del plan",d:"Basic y Developer traen verificaciones básicas; el set completo es Business/Enterprise."},{t:"Service limits",d:"Avisa cuando te acercás a la cuota de un servicio."}] },
    { name: "Organizations", d: "Gestión y facturación centralizada de múltiples cuentas.", link: "https://aws.amazon.com/organizations/",
      long: "Agrupa <strong>varias cuentas de AWS</strong> bajo una organización con una <strong>cuenta de administración</strong> al mando. Da tres cosas: <strong>facturación consolidada</strong> (una sola factura, y los descuentos por volumen se calculan sobre el total sumado), <strong>Unidades Organizativas (OU)</strong> para agrupar cuentas por ambiente o equipo, y <strong>Service Control Policies (SCP)</strong>, que definen el techo máximo de permisos de una cuenta. Una SCP no otorga permisos: <strong>limita</strong> lo que IAM puede llegar a permitir.",
      use: ["Separar producción, desarrollo y pruebas en cuentas distintas con aislamiento real.", "Una sola factura para toda la empresa y mejores descuentos por volumen agregado.", "Impedir por política que ninguna cuenta pueda desactivar CloudTrail o crear recursos fuera de una región.", "Crear cuentas nuevas de forma automatizada con configuración base."],
      avoid: ["Tenés una sola cuenta y no planeás más: la organización no aporta.", "Dar permisos a usuarios: eso es <strong>IAM</strong>. Las SCP solo restringen.", "Configurar toda una zona de aterrizaje desde cero &rarr; <strong>Control Tower</strong>, que se apoya en Organizations.", "Separar costos dentro de una misma cuenta: para eso alcanzan las etiquetas."],
      concepts: [{t:"Management account",d:"La cuenta raíz de la organización; recibe la factura consolidada."},{t:"OU",d:"Unidad Organizativa: grupo de cuentas que comparten políticas."},{t:"SCP",d:"Política que fija el máximo de permisos posibles. Restringe, nunca otorga."},{t:"Facturación consolidada",d:"Una factura para todas las cuentas, con descuentos por volumen agregado."}] },
  ]},
  { cat: "Analítica", accent: "#F26FA0", items: [
    { name: "Athena", d: "Consultas SQL serverless directo sobre archivos en S3.", link: "https://aws.amazon.com/athena/",
      long: "Consultas <strong>SQL serverless</strong> directamente sobre archivos guardados en <strong>S3</strong> — CSV, JSON, Parquet, ORC — sin cargar nada a ninguna base ni levantar infraestructura. Definís un esquema sobre los archivos y consultás. Se paga <strong>por terabyte escaneado</strong>, así que el formato importa muchísimo: guardar en <strong>Parquet</strong> comprimido y particionado puede reducir el costo de una consulta en más del 90% frente al mismo dato en CSV.",
      use: ["Explorar logs o exports en S3 sin montar un data warehouse.", "Consultas ocasionales sobre un data lake: pagás solo lo que escaneás.", "Analizar logs de CloudTrail, ALB o CloudFront con SQL.", "Prototipar el análisis de un dataset antes de decidir si amerita Redshift."],
      avoid: ["Consultas frecuentes y repetidas sobre los mismos datos &rarr; <strong>Redshift</strong> sale más previsible.", "Necesitás milisegundos de respuesta: Athena tarda segundos o minutos.", "Cargas transaccionales de una aplicación &rarr; <strong>RDS</strong> o <strong>DynamoDB</strong>.", "Transformaciones pesadas y complejas &rarr; <strong>EMR</strong> o AWS Glue."],
      concepts: [{t:"Esquema al leer",d:"El esquema se define al consultar, no al guardar el archivo."},{t:"Glue Data Catalog",d:"Catálogo donde viven las definiciones de tablas que usa Athena."},{t:"Partición",d:"Organizar los archivos por fecha o categoría para escanear menos."},{t:"Parquet",d:"Formato columnar comprimido; reduce drásticamente el costo por consulta."},{t:"Costo por TB escaneado",d:"Se factura por datos leídos, no por tiempo de consulta."}] },
    { name: "Kinesis", d: "Ingesta y procesamiento de datos en tiempo real (streaming).", link: "https://aws.amazon.com/kinesis/",
      long: "Familia de servicios para <strong>datos en streaming</strong>: captura y procesa eventos <strong>a medida que ocurren</strong>, en vez de esperar a un proceso por lotes nocturno. <strong>Data Streams</strong> es el flujo crudo, con retención configurable y varios consumidores leyendo en paralelo. <strong>Data Firehose</strong> es la vía simple: entrega automáticamente a S3, Redshift u OpenSearch sin escribir código de consumo. Encaja de forma natural con telemetría de IoT, clickstream y logs de aplicaciones.",
      use: ["Telemetría de dispositivos IoT que llega de forma continua.", "Clickstream de un sitio para analítica casi en tiempo real.", "Centralizar logs de muchas aplicaciones hacia S3 con Firehose.", "Detección de fraude o anomalías sobre eventos en vivo."],
      avoid: ["Mensajes puntuales entre dos servicios &rarr; <strong>SQS</strong>, mucho más simple.", "Notificar a varios suscriptores &rarr; <strong>SNS</strong>.", "El proceso por lotes cada varias horas ya te alcanza: el streaming agrega complejidad.", "Volumen bajo de eventos: el costo fijo de los shards no se justifica."],
      concepts: [{t:"Shard",d:"Unidad de capacidad del stream; define throughput y costo."},{t:"Producer / Consumer",d:"Quien escribe eventos y quien los lee."},{t:"Retención",d:"Los datos quedan disponibles entre 24 horas y 365 días para reprocesarse."},{t:"Firehose",d:"Entrega gestionada a S3, Redshift u OpenSearch sin código."},{t:"vs SQS",d:"Kinesis permite varios consumidores y releer el histórico; en SQS el mensaje se consume y desaparece."}] },
    { name: "EMR", d: "Big data administrado sobre Hadoop/Spark.", link: "https://aws.amazon.com/emr/",
      long: "<strong>Clusters administrados de big data</strong> con el ecosistema open source: <strong>Spark, Hadoop, Hive, Presto, HBase</strong>. AWS aprovisiona las instancias, instala el software y los administra; vos corrés tus jobs. Sirve para transformaciones pesadas que no entran en una consulta SQL: limpieza de datos a gran escala, ETL complejo, entrenamiento distribuido. Puede correr sobre <strong>Spot</strong> para abaratar mucho, y en modo <strong>EMR Serverless</strong> ni siquiera hay cluster que dimensionar.",
      use: ["Procesar terabytes con Spark aplicando lógica propia en Python o Scala.", "Migrar a AWS un pipeline Hadoop o Spark que ya existe on-premise.", "ETL pesado que prepara los datos antes de cargarlos a Redshift.", "Cargas grandes tolerantes a interrupción, corriendo sobre Spot."],
      avoid: ["Consultas SQL puntuales sobre S3 &rarr; <strong>Athena</strong>, sin cluster que administrar.", "Reportes de BI sobre datos estructurados &rarr; <strong>Redshift</strong>.", "Volúmenes chicos: administrar un cluster Spark es sobredimensionado.", "Tu equipo no conoce Spark ni Hadoop: la curva es empinada."],
      concepts: [{t:"Cluster",d:"Conjunto de nodos: uno maestro, los core y los de tarea."},{t:"Spark / Hadoop",d:"Motores de procesamiento distribuido que EMR administra."},{t:"EMR Serverless",d:"Corre los jobs sin dimensionar ni administrar cluster."},{t:"Spot en nodos de tarea",d:"Práctica habitual para bajar el costo de forma drástica."}] },
